  - "gdc-buckets"
  - "gdc-cloud-nat-gateway"
  - "gdc-clusters"
  - "gdc-dashboards"
  - "gdc-dbs"
  - "gdc-dns"
  - "gdc-harbors"
  - "gdc-iac"
  - "gdc-iam-role-bindings"
