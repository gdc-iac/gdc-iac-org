---
# ==============================================================================
# Dual-Mode Chart Resolution:
#
# Mode 1 (Default / Development): Local relative filesystem paths
# When chart versions are omitted, Helmfile resolves charts directly from the
# local repository directory (e.g. "../../../charts/gdc-<chart>").
#
# Mode 2 (Enterprise / Production / OCI Registry): Remote OCI artifacts
# Downstream consumers pulling packaged charts from an enterprise registry
# (such as an air-gapped Harbor or GHCR) configure the OCI URL and pinned version:
#
# Example OCI configuration:
#   gdc_clusters_chart_path: "oci://harbor.infra.gdc.example.com/charts/gdc-clusters"
#   gdc_clusters_chart_version: "0.1.3"
# ==============================================================================

