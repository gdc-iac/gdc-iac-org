# admin-bootstrap.yaml
# Declarative Kubernetes manifests for GDC Admin Cluster bootstrapping.
# Creates ServiceAccounts, Secrets, and K8s-native ClusterRoleBindings.

apiVersion: v1
kind: ServiceAccount
metadata:
  name: platform-bootstrap-sa
  namespace: iac-root
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: test-runner-sa
  namespace: iac-root
---
apiVersion: v1
kind: Secret
metadata:
  name: platform-bootstrap-sa-token
  namespace: iac-root
  annotations:
    kubernetes.io/service-account.name: platform-bootstrap-sa
type: kubernetes.io/service-account-token
---
apiVersion: v1
kind: Secret
metadata:
  name: test-runner-sa-token
  namespace: iac-root
  annotations:
    kubernetes.io/service-account.name: test-runner-sa
type: kubernetes.io/service-account-token
---
# Grant cluster-admin to platform-bootstrap-sa on Admin Cluster (required for ProjectBindings)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: platform-bootstrap-sa--cluster-admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
- kind: ServiceAccount
  name: platform-bootstrap-sa
  namespace: iac-root
---
# Grant cluster-admin to test-runner-sa on Admin Cluster (required for VM provisioning/status checks)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: test-runner-sa--cluster-admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
- kind: ServiceAccount
  name: test-runner-sa
  namespace: iac-root
