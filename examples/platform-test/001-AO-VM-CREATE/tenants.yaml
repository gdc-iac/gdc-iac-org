# tenants.yaml for 001-AO-VM-CREATE Virtual Machine Provisioning
# This file defines the desired state for the ioc-test project.

# Global chart paths (relative to this folder)
gdc_buckets_chart_path: "../../charts/gdc-buckets"
gdc_dbs_chart_path: "../../charts/gdc-dbs"
gdc_iam_roles_chart_path: "../../charts/gdc-iam-roles"
gdc_iam_rolebindings_chart_path: "../../charts/gdc-iam-role-bindings"
gdc_projects_chart_path: "../../charts/gdc-projects"
gdc_projects_sa_chart_path: "../../charts/gdc-project-service-accounts"
gdc_vm_chart_path: "../../charts/gdc-vm"

gdc_tenants:
  ioc-test-tenant:
    global:
      projects:
        - name: "ioc-test-project-001"
          # Ensure the project propagates to the user cluster
          cluster_bindings:
            - clusterName: "user-vm-1" # Match your user cluster name
          iamrolebindings:
            # PR-01: User has the appropriate RBAC roles (project-vm-admin and project-viewer)
            - role: "project-vm-admin"
              subject_kind: "User"
              subject_name: "fop-iac@example.com"
            - role: "project-networkpolicy-admin"
              subject_kind: "User"
              subject_name: "fop-iac@example.com"
            - role: "project-viewer"
              subject_kind: "User"
              subject_name: "fop-iac@example.com"
          resources:
            vms:
              # Step 2-5: Specify VM name, image, and resources
              - name: "ioc-test-vm"
                image_name: "ubuntu-24.04-v20260224-gdch" # PR-02: GDC-provided OS image
                image_namespace: "vm-system"
                boot_disk_size: "20Gi"
                machine_type: "n3-standard-2-gdc"
                ssh:
                  uiAccessEnabled: true
                  createProjectNetworkPolicy: true
