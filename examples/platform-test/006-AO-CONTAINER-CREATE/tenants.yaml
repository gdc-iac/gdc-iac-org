# tenants.yaml for 006-AO-CONTAINER-CREATE Deploy Containerized Services
# This file defines the desired state for the test-project-006.

# Global chart paths (relative to this folder)
gdc_buckets_chart_path: "../../../charts/gdc-buckets"
gdc_dbs_chart_path: "../../../charts/gdc-dbs"
gdc_iam_roles_chart_path: "../../../charts/gdc-iam-roles"
gdc_iam_rolebindings_chart_path: "../../../charts/gdc-iam-role-bindings"
gdc_projects_chart_path: "../../../charts/gdc-projects"
gdc_projects_sa_chart_path: "../../../charts/gdc-project-service-accounts"
gdc_vm_chart_path: "../../../charts/gdc-vm"
gdc_subnets_chart_path: "../../../charts/gdc-subnets"
gdc_project_network_policies_chart_path: "../../../charts/gdc-project-network-policies"
gdc_load_balancers_chart_path: "../../../charts/gdc-load-balancers"
gdc_kms_chart_path: "../../../charts/gdc-kms"
gdc_workloads_chart_path: "../../../charts/gdc-workloads"
gdc_project_bindings_chart_path: "../../../charts/gdc-project-bindings"

gdc_tenants:
  test-tenant-006:
    global:
      projects:
        - name: "test-project-006"
          iamrolebindings:
            # PR-02: Runner SA has the namespace-admin role to deploy workloads.
            - role: "namespace-admin"
              subject_kind: "ServiceAccount"
              subject_name: "test-runner-006-sa"
              subject_namespace: "iac-root"
            # PR-02: OIDC User has the namespace-admin role for adhoc deployments.
            - role: "namespace-admin"
              subject_kind: "User"
              subject_name: "fop-iac@example.com"
            - role: "project-viewer"
              subject_kind: "ServiceAccount"
              subject_name: "test-runner-006-sa"
              subject_namespace: "iac-root"
            - role: "project-viewer"
              subject_kind: "User"
              subject_name: "fop-iac@example.com"
          
          # Map this project to the user cluster
          cluster_bindings:
            - clusterName: "user-vm-1"

          resources:
            # Step 2: Apply a deployment manifest
            workloads:
              deployments:
                - name: "nginx-deployment"
                  image: "harbor.org-1.zone1.google.gdch.test/library/private-cloud-staging/toolbox:latest"
                  replicas: 1
                  command: ["/bin/bash", "-c", "sleep infinity"]
                  ports:
                    - 80
              services:
                - name: "nginx-service"
                  deploymentName: "nginx-deployment"
                  type: "ClusterIP"
                  ports:
                    - port: 80
                      targetPort: 80
                      protocol: "TCP"
