# tenants.yaml for 003-VM-IPERF3 VM to VM iperf3 Test
# This file defines the desired state for the ioc-test-vm-iperf3 project.

# Global chart paths (relative to this folder)
gdc_iam_roles_chart_path: "../../../../charts/gdc-iam-roles"
gdc_iam_rolebindings_chart_path: "../../../../charts/gdc-iam-role-bindings"
gdc_projects_chart_path: "../../../../charts/gdc-projects"
gdc_projects_sa_chart_path: "../../../../charts/gdc-project-service-accounts"
gdc_vm_chart_path: "../../../../charts/gdc-vm"
gdc_project_network_policies_chart_path: "../../../../charts/gdc-project-network-policies"

gdc_tenants:
  ioc-test-tenant:
    global:
      projects:
        - name: "load-test-project-003"
          # Ensure the project propagates to the user cluster
          cluster_bindings:
            - clusterName: "user-vm-1" # Match your user cluster name
          iamrolebindings:
            # PR-01: User has the appropriate RBAC roles for virtual machines and network policies
            - role: "project-vm-admin"
              subject_kind: "User"
              subject_name: "fop-iac@example.com"
            - role: "project-vm-admin"
              subject_kind: "User"
              subject_name: "system:serviceaccount:iac-root:test-runner-003-sa"
            - role: "project-networkpolicy-admin"
              subject_kind: "User"
              subject_name: "fop-iac@example.com"
            - role: "project-networkpolicy-admin"
              subject_kind: "User"
              subject_name: "system:serviceaccount:iac-root:test-runner-003-sa"
            - role: "project-viewer"
              subject_kind: "User"
              subject_name: "fop-iac@example.com"
            - role: "project-viewer"
              subject_kind: "User"
              subject_name: "system:serviceaccount:iac-root:test-runner-003-sa"
          resources:
            projectnetworkpolicies:
              # Open port 5201 for VM-to-VM iperf3 traffic
              - name: "allow-iperf3-traffic"
                ingress:
                  - from:
                    - ip_block:
                        cidr: "0.0.0.0/0"
                    ports:
                      - port: 5201
                        protocol: TCP
                      - port: 5201
                        protocol: UDP
            vms:
              # VM 1: iperf3 server
              - name: "iperf3-server-vm"
                image_name: "ubuntu-24.04-v20260224-gdch" # GDC-provided OS image
                image_namespace: "vm-system"
                boot_disk_size: "20Gi"
                machine_type: "n3-standard-2-gdc"
                ssh:
                  uiAccessEnabled: true
                  createProjectNetworkPolicy: true
              # VM 2: iperf3 client
              - name: "iperf3-client-vm"
                image_name: "ubuntu-24.04-v20260224-gdch"
                image_namespace: "vm-system"
                boot_disk_size: "20Gi"
                machine_type: "n3-standard-2-gdc"
                ssh:
                  uiAccessEnabled: true
                  createProjectNetworkPolicy: true
