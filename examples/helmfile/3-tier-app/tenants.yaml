gdc_iam_rolebindings_chart_path: "../../../charts/gdc-iam-role-bindings"

dev-env:
  gdc_tenants:
    3-tier-app-tenant:
      global:
        projects:
          - name: "frontend-prj"
          - name: "applogic-prj"
          - name: "data-prj"
          - name: "golden-images-prj"
        
#        org_network_policies:
#          - name: "allow-vertex-ai-access"
#            subject:
#              services:
#                match_types:
#                  - "ai"
#            ingress:
#              - from:
#                - ip_block:
#                    cidr: "10.0.0.0/8"

#        org_policies:
#          - name: "no-update-to-marketplace-service"
#            apiGroup: "marketplace.gdc.goog"
#            kind: "MarketplaceService"
#            disabledOperations:
#              - "UPDATE"

      projects:
        - name: "frontend-prj"
          serviceaccounts:
            - "frontend-sa"
          iamrolebindings:
            - role: "project-editor"
              subject_kind: "Group"
              subject_name: "frontend-viewers@example.com"
            - role: "project-networkpolicy-admin"
              subject_kind: "User"
              subject_name: "fop-iac@example.com"
          network_policies:
            - name: "allow-ingress-to-frontend"
              subject:
                match_labels:
                  app: "frontend"
              ingress:
                - from:
                    - ip_block:
                        cidr: "0.0.0.0/0" # Assuming frontend is public or open to org

        - name: "applogic-prj"
          serviceaccounts:
            - "applogic-sa"
          iamrolebindings:
            - role: "project-editor"
              subject_kind: "Group"
              subject_name: "applogic-viewers@example.com"
            - role: "project-networkpolicy-admin"
              subject_kind: "User"
              subject_name: "fop-iac@example.com"
          network_policies:
            - name: "allow-ingress-from-frontend"
              subject:
                match_labels:
                  app: "applogic"
              ingress:
                - from:
                    - project_selector:
                        projects:
                          match_names:
                            - "frontend-prj"

        - name: "data-prj"
          serviceaccounts:
            - "data-sa"
          iamrolebindings:
            - role: "project-editor"
              subject_kind: "Group"
              subject_name: "data-viewers@example.com"
            - role: "project-networkpolicy-admin"
              subject_kind: "User"
              subject_name: "fop-iac@example.com"
          network_policies:
            - name: "allow-ingress-from-applogic"
              subject:
                match_labels:
                  app: "database"
              ingress:
                - from:
                    - project_selector:
                        projects:
                          match_names:
                            - "applogic-prj"

        - name: "golden-images-prj"
          serviceaccounts:
            - "harbor-builder-sa"
          iamrolebindings:
            - role: "project-editor"
              subject_kind: "User"
              subject_name: "fop-iac@example.com"
#            - role: "harbor-instance-admin"
#              subject_kind: "User"
#              subject_name: "fop-iac@example.com"
