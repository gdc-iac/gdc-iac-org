iac:
  # IaC can be invoked by user or service account
  # If invoked by user, subject_kind is User
  # If invoked by service account, subject_kind is ServiceAccount
- role: "project-iam-admin"
  subject_kind: "User"
  subject_name: &iac_subject_name "fop-iac001@example.com"
- role: "project-bucket-admin"
  subject_kind: "User"
  subject_name: *iac_subject_name
- role: "project-networkpolicy-admin"
  subject_kind: "User"
  subject_name: *iac_subject_name
- role: "harbor-instance-admin"
  subject_kind: "User"
  subject_name: *iac_subject_name
- role: "harbor-project-creator"
  subject_kind: "User"
  subject_name: *iac_subject_name
- role: "standard-cluster-admin"
  subject_kind: "User"
  subject_name: *iac_subject_name
- role: "workbench-notebooks-admin"
  subject_kind: "User"
  subject_name: *iac_subject_name
  # IaC can be invoked by user or service account
  # If invoked by service account, subject_kind is ServiceAccount
- role: "project-iam-admin"
  subject_kind: "ServiceAccount"
  subject_name: &iac_sa "system:serviceaccount:iac-root:iac001-sa"
- role: "project-bucket-admin"
  subject_kind: "ServiceAccount"
  subject_name: *iac_sa
- role: "project-networkpolicy-admin"
  subject_kind: "ServiceAccount"
  subject_name: *iac_sa
- role: "harbor-instance-admin"
  subject_kind: "ServiceAccount"
  subject_name: *iac_sa
- role: "harbor-project-creator"
  subject_kind: "ServiceAccount"
  subject_name: *iac_sa
- role: "standard-cluster-admin"
  subject_kind: "ServiceAccount"
  subject_name: *iac_sa
- role: "workbench-notebooks-admin"
  subject_kind: "ServiceAccount"
  subject_name: *iac_sa
global:
  backup_project_name: &backup_project_name "data-ets-backup"
  cluster_backup_repo_name: &cluster_backup_repo_name "d4-ets-cluster-backup"
  vm_backup_repo_name: &vm_backup_repo_name "d4-ets-vm-backup"
  harbor_backup_repo_name: &harbor_backup_repo_name "d4-ets-harbor-backup"
  shared_infra_project_name: &shared_infra_project_name "data-ets-shared-infra"
  projects:
    - name: *backup_project_name
us-east67-b:
  projects:
  - name: *backup_project_name
    backup-plans:
      cluster:
      - name: "d4-ets-cluster-backup-plan"
        targetCluster:
          targetClusterType: "UserCluster"
          targetClusterName:
            kind: "Cluster"
            name: "stress-test"
        cronSchedule: "0 2 * * *"
        clusterBackupRepositoryName: *cluster_backup_repo_name
  - name: *shared_infra_project_name
    backup-plans:
      harbor:
      - name: "d4-ets-harbor-backup-plan"
        harborInstance: "data-ets-mhs"
        cronSchedule: "0 3 * * *"
        backupRepository: *harbor_backup_repo_name
