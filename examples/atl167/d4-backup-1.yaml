iac:
  # IaC can be invoked by user or service account
  # If invoked by user, subject_kind is User
  # If invoked by service account, subject_kind is ServiceAccount
- role: "project-iam-admin"
  subject_kind: "User"
  subject_name: &iac_subject_name "fop-iac001@example.com"
- role: "project-bucket-admin"
  subject_kind: "User"
  subject_name: *iac_subject_name
- role: "project-networkpolicy-admin"
  subject_kind: "User"
  subject_name: *iac_subject_name
- role: "harbor-instance-admin"
  subject_kind: "User"
  subject_name: *iac_subject_name
- role: "harbor-project-creator"
  subject_kind: "User"
  subject_name: *iac_subject_name
- role: "standard-cluster-admin"
  subject_kind: "User"
  subject_name: *iac_subject_name
- role: "workbench-notebooks-admin"
  subject_kind: "User"
  subject_name: *iac_subject_name
- role: "secret-viewer"
  subject_kind: "User"
  subject_name: *iac_subject_name
  # IaC can be invoked by user or service account
  # If invoked by service account, subject_kind is ServiceAccount
- role: "project-iam-admin"
  subject_kind: "ServiceAccount"
  subject_name: &iac_sa "system:serviceaccount:iac-root:iac001-sa"
- role: "project-bucket-admin"
  subject_kind: "ServiceAccount"
  subject_name: *iac_sa
- role: "project-networkpolicy-admin"
  subject_kind: "ServiceAccount"
  subject_name: *iac_sa
- role: "harbor-instance-admin"
  subject_kind: "ServiceAccount"
  subject_name: *iac_sa
- role: "harbor-project-creator"
  subject_kind: "ServiceAccount"
  subject_name: *iac_sa
- role: "standard-cluster-admin"
  subject_kind: "ServiceAccount"
  subject_name: *iac_sa
- role: "workbench-notebooks-admin"
  subject_kind: "ServiceAccount"
  subject_name: *iac_sa
- role: "secret-viewer"
  subject_kind: "ServiceAccount"
  subject_name: *iac_sa
global:
  cluster_backup_bucket_name: &cluster_backup_bucket_name "cluster-backup"
  vm_backup_bucket_name: &vm_backup_bucket_name "vm-backup"
  harbor_backup_bucket_name: &harbor_backup_bucket_name "harbor-backup"
  backup_project_name: &backup_project_name "data-ets-backup"
  cluster_backup_sa: &cluster_backup_sa "cbk-sa"
  harbor_backup_sa: &harbor_backup_sa "hbk-sa"
  shared_infra_project_name: &shared_infra_project_name "data-ets-shared-infra"
  projects:
    - name: *backup_project_name
      project-service-accounts:
      - name: *cluster_backup_sa
    - name: *shared_infra_project_name
      project-service-accounts:
      - name: *harbor_backup_sa
us-east67-b:
  projects:
  - name: *backup_project_name
    buckets:
    - name: *cluster_backup_bucket_name
    - name: *vm_backup_bucket_name
    rbac-role-bindings:
    - role: "project-bucket-object-admin"
      subject_kind: "ServiceAccount"
      subject_name: *cluster_backup_sa
  - name: *shared_infra_project_name
    buckets:
    - name: *harbor_backup_bucket_name
    rbac-role-bindings:
    - role: "project-bucket-object-admin"
      subject_kind: "ServiceAccount"
      subject_name: *harbor_backup_sa