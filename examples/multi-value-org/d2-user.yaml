iac:
- role: "project-iam-admin"
  subject_kind: "User"
  subject_name: "gdch-infra-operator-fop-iac001@opscenter.local"
- role: "project-bucket-admin"
  subject_kind: "User"
  subject_name: "gdch-infra-operator-fop-iac001@opscenter.local"
global:
  user_subject_name: &user_subject_name "gdch-infra-operator-fop-etsuser@opscenter.local"
  admin_subject_name: &admin_subject_name "gdch-infra-operator-fop-etsadmin@opscenter.local"
  tools_bucket_role: &tools_bucket_role "d2-ets-s3-tools"
  ro_bucket_role: &ro_bucket_role "d2-ets-s3-ro1"
  rw_bucket_name: &rw_bucket_role "d2-ets-s3-rw1"
  shared_infra_project_name: &shared_infra_project_name "d2-ets-shared-infra"
  user_project_name: &user_project_name "d2-ets-user-1"
  iam-role-bindings: 
  - role: *tools_bucket_role
    subject_kind: "User"
    subject_name: *user_subject_name
    namespace: *shared_infra_project_name
  - role: *rw_bucket_role
    subject_kind: "User"
    subject_name: *user_subject_name
    namespace: *shared_infra_project_name
  - role: *ro_bucket_role
    subject_kind: "User"
    subject_name: *user_subject_name
    namespace: *shared_infra_project_name
  projects:
    - name: *user_project_name
      iam-role-bindings: 
      - role: "project-grafana-viewer"
        subject_kind: "User"
        subject_name: *admin_subject_name
      - role: "project-iam-admin"
        subject_kind: "User"
        subject_name: *admin_subject_name
      - role: "workload-viewer"
        subject_kind: "User"
        subject_name: *admin_subject_name
      - role: "workbench-notebooks-admin"
        subject_kind: "User"
        subject_name: *admin_subject_name
      - role: "backup-creator"
        subject_kind: "User"
        subject_name: *admin_subject_name
      - role: "secret-admin"
        subject_kind: "User"
        subject_name: *admin_subject_name
      - role: "namespace-admin"
        subject_kind: "User"
        subject_name: *admin_subject_name