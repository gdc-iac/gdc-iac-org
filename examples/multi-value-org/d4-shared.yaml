iac:
  subject_name: "fop-iac001@example.com"
global:
  admin_subject_name: &admin_subject_name "fop-etsadmin@example.com"
  tools_bucket_name: &tools_bucket_name "d4-ets-s3-tools"
  tools_bucket_role: &tools_bucket_role "d4-ets-s3-tools"
  ro_bucket_name: &ro_bucket_name "d4-ets-s3-ro1"
  ro_bucket_role: &ro_bucket_role "d4-ets-s3-ro1"
  rw_bucket_name: &rw_bucket_name "d4-ets-s3-rw1"
  rw_bucket_name: &rw_bucket_role "d4-ets-s3-rw1"
  shared_infra_project_name: &shared_infra_project_name "d4-ets-shared-infra"
  iam-roles:
    - name: *tools_bucket_role
      title: *tools_bucket_role
      description: *tools_bucket_role
      stage: "GA"
      zonalRules: |
        - apiGroups:
          - object.gdc.goog
          resources:
          - buckets
          verbs:
          - list
          - read-object
    - name: *ro_bucket_role
      title: *ro_bucket_role
      description: *ro_bucket_role
      stage: "GA"
      zonalRules: |
        - apiGroups:
          - object.gdc.goog
          resources:
          - buckets
          verbs:
          - list
          - read-object
    - name: *rw_bucket_role
      title: *rw_bucket_role
      description: *rw_bucket_role
      stage: "GA"
      zonalRules: |
        - apiGroups:
          - object.gdc.goog
          resources:
          - buckets
          verbs:
          - list
          - read-object
  projects:
    - name: *shared_infra_project_name
      harbor:
      - name: "data-ets-mhs"
        projects:
        - name: "data-ets-mhs"
      iam-role-bindings: 
      - role: "project-grafana-viewer"
        subject_kind: "User"
        subject_name: *admin_subject_name
      - role: "project-iam-admin"
        subject_kind: "User"
        subject_name: *admin_subject_name
      - role: "project-bucket-admin"
        subject_kind: "User"
        subject_name: *admin_subject_name
      - role: "project-bucket-object-admin"
        subject_kind: "User"
        subject_name: *admin_subject_name
      - role: "workload-viewer"
        subject_kind: "User"
        subject_name: *admin_subject_name
      - role: "backup-creator"
        subject_kind: "User"
        subject_name: *admin_subject_name
      - role: "harbor-instance-admin"
        subject_kind: "User"
        subject_name: *admin_subject_name
      - role: "harbor-project-creator"
        subject_kind: "User"
        subject_name: *admin_subject_name
zone1:
  projects:
  - name: *shared_infra_project_name
    buckets:
    - name: *tools_bucket_name
    - name: *ro_bucket_name
    - name: *rw_bucket_name