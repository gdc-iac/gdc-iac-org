iac:
- role: "project-iam-admin"
  subject_kind: "User"
  subject_name: "fop-iac001@example.com"
- role: "project-bucket-admin"
  subject_kind: "User"
  subject_name: "fop-iac001@example.com"
global:
  admin_subject_name: &admin_subject_name "fop-etsadmin@example.com"
  tools_bucket_name: &tools_bucket_name "shared-s3-tools-1"
  tools_bucket_role: &tools_bucket_role "shared-s3-tools-1"
  ro_bucket_name: &ro_bucket_name "shared-s3-ro-1"
  ro_bucket_role: &ro_bucket_role "shared-s3-ro-1"
  rw_bucket_name: &rw_bucket_name "shared-s3-rw-1"
  rw_bucket_name: &rw_bucket_role "shared-s3-rw-1"
  shared_infra_project_name: &shared_infra_project_name "shared-infra-1"
  billing:
    accounts:
    - name: *shared_infra_project_name
      display_name: "Shared Billing Account"
      cloud_billing_config_account_id: "01797D-641480-93C471"
  iam-roles:
    - name: *tools_bucket_role
      title: *tools_bucket_role
      description: *tools_bucket_role
      stage: "GA"
      zonalRules: |
        - apiGroups:
          - object.gdc.goog
          resources:
          - buckets
          verbs:
          - list
          - read-object
    - name: *ro_bucket_role
      title: *ro_bucket_role
      description: *ro_bucket_role
      stage: "GA"
      zonalRules: |
        - apiGroups:
          - object.gdc.goog
          resources:
          - buckets
          verbs:
          - list
          - read-object
    - name: *rw_bucket_role
      title: *rw_bucket_role
      description: *rw_bucket_role
      stage: "GA"
      zonalRules: |
        - apiGroups:
          - object.gdc.goog
          resources:
          - buckets
          verbs:
          - list
          - read-object
  projects:
    - name: *shared_infra_project_name
      billing:
        account_ref: *shared_infra_project_name
      project-network-policies:
      - subject:
          subject_type: ManagedService
          managed_services:
            match_types:
            - 'mhs'
        ingress:
        - from:
          - project_selector:
              projects:
                match_names:
                - "d4-ets-user-1"
      iam-role-bindings: 
      - role: "project-grafana-viewer"
        subject_kind: "User"
        subject_name: *admin_subject_name
      - role: "project-iam-admin"
        subject_kind: "User"
        subject_name: *admin_subject_name
      - role: "project-bucket-admin"
        subject_kind: "User"
        subject_name: *admin_subject_name
      - role: "project-bucket-object-admin"
        subject_kind: "User"
        subject_name: *admin_subject_name
      - role: "workload-viewer"
        subject_kind: "User"
        subject_name: *admin_subject_name
      - role: "backup-creator"
        subject_kind: "User"
        subject_name: *admin_subject_name
      - role: "harbor-instance-admin"
        subject_kind: "User"
        subject_name: *admin_subject_name
      - role: "harbor-project-creator"
        subject_kind: "User"
        subject_name: *admin_subject_name
us-east67-b:
  projects:
  - name: *shared_infra_project_name
    buckets:
    - name: *tools_bucket_name
    - name: *ro_bucket_name
    - name: *rw_bucket_name
    harbors:
    - name: "shared-infra-harbor"
      projects:
      - name: "shared-infra-1"
    notebooks:
    - name: "shared-infra-1-nb-01"
      nb_jupyter_image: "us-east67-b-docker.pkg.dev/shared-infra-1/repo/jupyter:latest"
      user_cluster_name: "shared-user-vm"
      sidecars:
      - name: "s3-proxy"
        image: "us-east67-b-docker.pkg.dev/shared-infra-1/repo/s3-proxy:latest"
        volumeMounts:
        - mountPath: /proxy/conf
          name: s3-proxy-config
        volumes:
        - name: s3-proxy-config
          persistentVolumeClaim:
            claimName: "shared-infra-1-nb-01-s3-proxy-config"
  clusters:
  - name: "shared-user-vm"
    namespace: "platform"
    clusterNetwork:
      podCIDRSize: 21
      serviceCIDRSize: 23
    initialVersion:
      kubernetesVersion: "1.30.12-gke.300"
    loadBalancer:
      ingressServiceIPSize: 21
    nodePools:
    - name: "worker-node-pool"
      machineTypeName: "n3-standard-16-gdc"
      nodeCount: 3
    releaseChannel: "UNSPECIFIED"
    projectBindings:
    - *shared_infra_project_name