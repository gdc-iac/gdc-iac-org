iac:
  # this service account is used by the iac pipeline to create and manage resources in the user project
  # it can be impersonated to run helm commands to manage the lifecycle of the user notebook and its dependencies
- role: "project-iam-admin"
  subject_kind: "User"
  subject_name: &iac_subject_name "system:serviceaccount:iac-root:iac001-sa"
- role: "project-bucket-admin"
  subject_kind: "User"
  subject_name: *iac_subject_name
- role: "project-networkpolicy-admin"
  subject_kind: "User"
  subject_name: *iac_subject_name
- role: "workbench-notebooks-admin"
  subject_kind: "User"
  subject_name:  *iac_subject_name
- role: "workbench-notebooks-viewer"
  subject_kind: "User"
  subject_name:  *iac_subject_name
global:
  # end user aka data scientist
  user_subject_name: &user_subject_name "org-70033-user-PUF587"
  # data privacy engineer with write permissions to the read only bucket 
  # and admin permissions to the user project to manage the lifecycle 
  # of the user notebook and its dependencies
  # admin user permissions for the buckets are defined in the shared infra project
  admin_subject_name: &admin_subject_name "org-70033-user-HGY395"
  # project and bucket names
  tools_bucket_role: &tools_bucket_role "d2-ets-s3-tools"
  ro_bucket_role: &ro_bucket_role "d2-ets-s3-ro1"
  rw_bucket_name: &rw_bucket_role "d2-ets-s3-rw1"
  shared_infra_project_name: &shared_infra_project_name "d2-ets-shared-infra"
  user_project_name: &user_project_name "d2-ets-user-puf587"
  # Data scientist has access to the shared tools bucket and read only access to the data buckets, 
  iam-role-bindings: 
  - role: *tools_bucket_role
    subject_kind: "User"
    subject_name: *user_subject_name
    namespace: *shared_infra_project_name
  - role: *rw_bucket_role
    subject_kind: "User"
    subject_name: *user_subject_name
    namespace: *shared_infra_project_name
  - role: *ro_bucket_role
    subject_kind: "User"
    subject_name: *user_subject_name
    namespace: *shared_infra_project_name
  projects:
    - name: *user_project_name
      iam-role-bindings: 
        # Admin user has admin permissions to manage the lifecycle of the user notebook and its dependencies 
        # This is optional and can be removed if you want to manage the user notebook lifecycle using the iac service account only
      - role: "project-grafana-viewer"
        subject_kind: "User"
        subject_name: *admin_subject_name
      - role: "project-iam-admin"
        subject_kind: "User"
        subject_name: *admin_subject_name
      - role: "workload-viewer"
        subject_kind: "User"
        subject_name: *admin_subject_name
      - role: "workbench-notebooks-admin"
        subject_kind: "User"
        subject_name: *admin_subject_name
      - role: "workbench-notebooks-viewer"
        subject_kind: "User"
        subject_name: *admin_subject_name
      - role: "backup-creator"
        subject_kind: "User"
        subject_name: *admin_subject_name
      - role: "secret-admin"
        subject_kind: "User"
        subject_name: *admin_subject_name
      - role: "namespace-admin"
        subject_kind: "User"
        subject_name: *admin_subject_name
        # Data scientist has view permissions to the user project - this is only needed
        # if this user is using the GDC console to access the notebooks
      - role: "project-viewer"
        subject_kind: "User"
        subject_name: *user_subject_name
        # Data scientist has admin permissions to manage the lifecycle of the user notebook using 
        # the notebooks.<zone> URL.
        # this is not needed if you are not allowing the console access
      - role: "workbench-notebooks-viewer"
        subject_kind: "User"
        subject_name:  *user_subject_name
us-east67-b:
  projects:
  - name: *user_project_name
    notebooks:
    - name: &user_subject_name_nb "org-70033-user-puf587-nb"
      nb_jupyter_image: "gcr.io/private-cloud-staging/notebooks/deeplearning-platform-release/tf2-gpu:m125"
      user_cluster_name: "dga-ets"
      sidecars:
      - name: "s3-proxy"
        image: "data-ets-mhs-data-ets-infra.org-70033.lux-central1-a.lux.clr/dga/lu/etat/ci/ets/platform/ops/s3-proxy@sha256:7eff03cd821638cde5f1fa8d02c130471451c23b69069e3384a81eb235bcbd02"
        volumeMounts:
        - mountPath: /proxy/conf
          name: s3-proxy-config
        volumes:
        - name: s3-proxy-config
          persistentVolumeClaim:
            claimName: *user_subject_name_nb