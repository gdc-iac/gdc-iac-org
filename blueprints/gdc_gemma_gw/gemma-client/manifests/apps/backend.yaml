apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      serviceAccountName: gemma-client-sa
      containers:
      - name: backend
        image: gemma-client-backend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
        env:
        - name: PROJECT_ID
          value: "PROJECT_ID_PLACEHOLDER" # Placeholder
        - name: INPUT_BUCKET
          value: "gs://INPUT_BUCKET_PLACEHOLDER" # Placeholder
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: gemma-client-db-credentials
              key: connection_string
        - name: REGION
          value: "us-central1"
        # - name: GEMINI_ENDPOINT
        #   value: "us-central1-aiplatform.googleapis.com" # Uncomment to override
        - name: GEMMA_MODEL
          value: "gemma4:26b"
        - name: GATEWAY_URL
          value: "http://gemma-gateway/v1"
---
apiVersion: v1
kind: Service
metadata:
  name: backend-svc
spec:
  selector:
    app: backend
  ports:
  - port: 8000
    targetPort: 8000
  type: ClusterIP
