apiVersion: v1
kind: ConfigMap
metadata:
  name: gemma-ingress-config
  namespace: gemma-inference
data:
  nginx.conf: |
    user nginx;
    worker_processes auto;
    error_log /var/log/nginx/error.log warn;
    pid /tmp/nginx.pid;

    events {
        worker_connections 1024;
    }

    http {
        include /etc/nginx/mime.types;
        default_type application/octet-stream;

        client_body_temp_path /tmp/client_body;
        fastcgi_temp_path /tmp/fastcgi_temp;
        proxy_temp_path /tmp/proxy_temp;
        scgi_temp_path /tmp/scgi_temp;
        uwsgi_temp_path /tmp/uwsgi_temp;

        sendfile on;
        keepalive_timeout 65;

        server {
            listen 8080;
            server_name localhost;
            client_max_body_size 50M;

            # Keycloak OAuth2 federation mapping
            location /auth {
                proxy_pass http://keycloak-svc:8080;
                proxy_set_header Host $http_host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto https;
                proxy_set_header X-Forwarded-Host $http_host;
            }

            # Backend RAG API mapping
            location /api/ {
                proxy_pass http://backend-svc:8000/;
                proxy_set_header Host $http_host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto https;
                proxy_connect_timeout 300s;
                proxy_send_timeout 300s;
                proxy_read_timeout 300s;
            }

            # Frontend application mapping
            location / {
                proxy_pass http://frontend-svc:80;
                proxy_set_header Host $http_host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto https;
            }
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gemma-ingress-gateway
  namespace: gemma-inference
  labels:
    app: gemma-ingress-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gemma-ingress-gateway
  template:
    metadata:
      labels:
        app: gemma-ingress-gateway
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101 # Nginx standard UID inside alpine
        fsGroup: 101
      containers:
      - name: ingress-proxy
        image: nginx:1.25-alpine-slim
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: http
        volumeMounts:
        - name: config-volume
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
        resources:
          requests:
            cpu: "50m"
            memory: "64Mi"
          limits:
            cpu: "200m"
            memory: "128Mi"
      volumes:
      - name: config-volume
        configMap:
          name: gemma-ingress-config
---
apiVersion: v1
kind: Service
metadata:
  name: gemma-ingress-gateway
  namespace: gemma-inference
spec:
  selector:
    app: gemma-ingress-gateway
  ports:
  - name: http
    port: 80
    targetPort: 8080
  type: ClusterIP
