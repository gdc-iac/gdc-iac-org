apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: test-project
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      nodeSelector:
        pool: cpu
      serviceAccountName: gemma-client-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: backend
        image: harbor.gdc.local/gemma-client-backend:latest
        imagePullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "4"]
        ports:
        - containerPort: 8000
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 10
        env:
        - name: PROJECT_ID
          value: "test-project" # Placeholder
        - name: INPUT_BUCKET
          value: "gs://gemma-client-files-test-project" # Placeholder
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: gemma-client-db-credentials
              key: connection_string
        - name: REGION
          value: "us-central1"
        - name: GEMMA_MODEL
          value: "gemma4:26b"
        - name: GATEWAY_URL
          value: "http://gemma-gateway.gemma-inference.svc.cluster.local/v1"
        - name: ENABLE_OIDC
          value: "true"
        - name: KEYCLOAK_URL
          value: "http://keycloak-svc:8080/auth/realms/gdc-rag-realm"
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: db-ca
          mountPath: /etc/db-tls
          readOnly: true
      volumes:
      - name: tmp
        emptyDir: {}
      - name: db-ca
        secret:
          secretName: gemma-client-db-credentials
          optional: true
          items:
          - key: ca.crt
            path: ca.crt
---
apiVersion: v1
kind: Service
metadata:
  name: backend-svc
  namespace: test-project
spec:
  selector:
    app: backend
  ports:
  - port: 8000
    targetPort: 8000
  type: ClusterIP
