suite: gemma-gemma-client chart unit tests
templates:
  - templates/apps/workloads.yaml
  - templates/gdc/resources.yaml
tests:
  - it: should render User Cluster workloads by default
    template: templates/apps/workloads.yaml
    asserts:
      - hasDocuments:
          count: 7
      - isKind:
          of: Deployment
        documentIndex: 0
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[1].name
          value: db-ca
        documentIndex: 0
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[1].mountPath
          value: /etc/db-tls
        documentIndex: 0
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[1].readOnly
          value: true
        documentIndex: 0
      - equal:
          path: spec.template.spec.volumes[1].name
          value: db-ca
        documentIndex: 0
      - equal:
          path: spec.template.spec.volumes[1].secret.secretName
          value: gemma-client-db-credentials
        documentIndex: 0
      - equal:
          path: spec.template.spec.volumes[1].secret.optional
          value: true
        documentIndex: 0
      - equal:
          path: spec.template.spec.securityContext.runAsUser
          value: 101
        documentIndex: 2
      - equal:
          path: spec.template.spec.containers[0].ports[0].containerPort
          value: 8080
        documentIndex: 2
      - equal:
          path: spec.ports[0].port
          value: 80
        documentIndex: 3
      - equal:
          path: spec.ports[0].targetPort
          value: 8080
        documentIndex: 3
  - it: should not render GDC resources by default
    template: templates/gdc/resources.yaml
    asserts:
      - hasDocuments:
          count: 0
  - it: should render Zonal DBCluster Secret, DBCluster, and Global IAMRoleBinding when gdc.enabled is true
    set:
      gdc:
        enabled: true
      global:
        projectId: gemma-inference
        namespace: gemma-inference
    template: templates/gdc/resources.yaml
    asserts:
      - hasDocuments:
          count: 3
      - isKind:
          of: Secret
        documentIndex: 0
      - equal:
          path: metadata.name
          value: db-pw-gemma-client-db
        documentIndex: 0
      - isKind:
          of: DBCluster
        documentIndex: 1
      - equal:
          path: metadata.name
          value: gemma-client-db
        documentIndex: 1
      - equal:
          path: spec.availability.enableHighAvailability
          value: true
        documentIndex: 1
      - equal:
          path: spec.primarySpec.version
          value: "15"
        documentIndex: 1
      - equal:
          path: spec.primarySpec.adminUser.passwordRef.name
          value: db-pw-gemma-client-db
        documentIndex: 1
      - isKind:
          of: IAMRoleBinding
        documentIndex: 2
      - equal:
          path: spec.roleRef.name
          value: project-bucket-object-admin
        documentIndex: 2
