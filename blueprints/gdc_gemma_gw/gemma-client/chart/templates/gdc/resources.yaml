{{- if .Values.gdc.enabled }}
apiVersion: postgresql.dbadmin.gdc.goog/v1
kind: DBCluster
metadata:
  name: gemini-db
  namespace: {{ include "gemma-gemma-client.namespace" . }}
  labels:
    {{- include "gemma-gemma-client.labels" . | nindent 4 }}
spec:
  version: POSTGRESQL_14
  availabilityType: ZONAL_HA
  resources:
    requests:
      cpu: '2'
      memory: 8Gi
  storage:
    size: 50G
---
apiVersion: iam.gdc.goog/v1
kind: IAMPolicyBinding
metadata:
  name: gemma-client-storage-admin
  namespace: {{ include "gemma-gemma-client.namespace" . }}
  labels:
    {{- include "gemma-gemma-client.labels" . | nindent 4 }}
spec:
  subjects:
  - kind: ServiceAccount
    name: gemini-gui-sa
    namespace: {{ include "gemma-gemma-client.namespace" . }}
  roleRef:
    kind: IAMRole
    name: roles/storage.objectAdmin
{{- end }}
