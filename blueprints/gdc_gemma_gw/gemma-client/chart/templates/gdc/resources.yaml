{{- if .Values.gdc.enabled }}
{{- $ns := include "gemma-gemma-client.namespace" . -}}
{{- $projectId := .Values.global.projectId | default $ns -}}
apiVersion: postgresql.dbadmin.gdc.goog/v1
kind: DBCluster
metadata:
  name: gemini-db
  namespace: {{ $ns }}
  labels:
    {{- include "gemma-gemma-client.labels" . | nindent 4 }}
spec:
  version: POSTGRESQL_14
  availabilityType: ZONAL_HA
  resources:
    requests:
      cpu: '2'
      memory: 8Gi
  storage:
    size: 50G
---
apiVersion: iam.global.gdc.goog/v1
kind: IAMRoleBinding
metadata:
  name: gemma-client-sa--project-bucket-object-admin
  namespace: {{ $projectId }}
  labels:
    iam.global.gdc.goog/iam-role-name: project-bucket-object-admin
    {{- include "gemma-gemma-client.labels" . | nindent 4 }}
spec:
  roleRef:
    apiGroup: iam.global.gdc.goog/v1
    kind: IAMRole
    name: project-bucket-object-admin
  subjects:
    - kind: ServiceAccount
      name: gemma-client-sa
      namespace: {{ $projectId }}
{{- end }}
