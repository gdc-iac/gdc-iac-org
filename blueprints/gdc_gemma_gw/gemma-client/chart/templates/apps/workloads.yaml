{{- if .Values.apps.enabled }}
{{- $registry := .Values.registry | default .Values.global.registry -}}
{{- $projectId := .Values.global.projectId | default "test-project" -}}
{{- $bucket := .Values.apps.inputBucket | default (printf "%s-gemma-input" $projectId) -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: {{ include "gemma-gemma-client.namespace" . }}
  labels:
    {{- include "gemma-gemma-client.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      serviceAccountName: gemma-client-sa
      containers:
      - name: backend
        image: {{ if $registry }}{{ $registry }}/gemma-client-backend:{{ .Values.apps.imageTag | default "latest" }}{{ else }}gemma-client-backend:latest{{ end }}
        imagePullPolicy: {{ .Values.apps.imagePullPolicy | default "IfNotPresent" }}
        command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "4"]
        ports:
        - containerPort: 8000
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 10
        env:
        - name: PROJECT_ID
          value: {{ $projectId | quote }}
        - name: INPUT_BUCKET
          value: {{ printf "gs://%s" $bucket | quote }}
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: gemma-client-db-credentials
              key: connection_string
        - name: REGION
          value: us-central1
        - name: GEMMA_MODEL
          value: gemma4:26b
        - name: GATEWAY_URL
          value: {{ .Values.apps.gatewayUrl | default "http://gemma-gateway/v1" | quote }}
        - name: ENABLE_OIDC
          value: {{ .Values.apps.enableOidc | default "true" | quote }}
        - name: KEYCLOAK_URL
          value: {{ .Values.apps.keycloakUrl | default "http://keycloak-svc:8080/auth/realms/gdc-rag-realm" | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: backend-svc
  namespace: {{ include "gemma-gemma-client.namespace" . }}
  labels:
    {{- include "gemma-gemma-client.labels" . | nindent 4 }}
spec:
  selector:
    app: backend
  ports:
  - port: 8000
    targetPort: 8000
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: {{ include "gemma-gemma-client.namespace" . }}
  labels:
    {{- include "gemma-gemma-client.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: {{ if $registry }}{{ $registry }}/gemma-client-frontend:{{ .Values.apps.imageTag | default "latest" }}{{ else }}gemma-client-frontend:latest{{ end }}
        imagePullPolicy: {{ .Values.apps.imagePullPolicy | default "IfNotPresent" }}
        ports:
        - containerPort: 80
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
        env:
        - name: VITE_API_URL
          value: /api
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-svc
  namespace: {{ include "gemma-gemma-client.namespace" . }}
  labels:
    {{- include "gemma-gemma-client.labels" . | nindent 4 }}
spec:
  selector:
    app: frontend
  ports:
  - port: 80
    targetPort: 80
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cross-cluster-gateway-ingress
  namespace: {{ include "gemma-gemma-client.namespace" . }}
  annotations:
    networking.gdc.goog/internal-loadbalancer: 'true'
  labels:
    {{- include "gemma-gemma-client.labels" . | nindent 4 }}
spec:
  rules:
  - host: gemma-gateway.shared-services.gdc.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: gemma-gateway
            port:
              number: 80
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-tenant-ingress-to-gateway
  namespace: {{ include "gemma-gemma-client.namespace" . }}
  labels:
    {{- include "gemma-gemma-client.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: gemma-gateway
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: gemma-inference
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: {{ include "gemma-gemma-client.namespace" . }}
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: test-project
    - ipBlock:
        cidr: 172.16.0.0/12
    - ipBlock:
        cidr: 10.0.0.0/8
    - ipBlock:
        cidr: 35.191.0.0/16
    - ipBlock:
        cidr: 130.211.0.0/22
    ports:
    - protocol: TCP
      port: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gemma-unified-routes
  namespace: {{ include "gemma-gemma-client.namespace" . }}
  labels:
    {{- include "gemma-gemma-client.labels" . | nindent 4 }}
spec:
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: gdc-platform-gateway
    namespace: gemma-inference
  {{- if .Values.apps.hostnames }}
  hostnames:
    {{- toYaml .Values.apps.hostnames | nindent 4 }}
  {{- end }}
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /auth
    filters:
    - type: RequestHeaderModifier
      requestHeaderModifier:
        set:
        - name: X-Forwarded-Proto
          value: https
    backendRefs:
    - name: keycloak-svc
      port: 8080
  - matches:
    - path:
        type: PathPrefix
        value: /api
    filters:
    - type: RequestHeaderModifier
      requestHeaderModifier:
        set:
        - name: X-Forwarded-Proto
          value: https
    - type: URLRewrite
      urlRewrite:
        path:
          type: ReplacePrefixMatch
          replacePrefixMatch: /
    backendRefs:
    - name: backend-svc
      port: 8000
  - matches:
    - path:
        type: PathPrefix
        value: /
    filters:
    - type: RequestHeaderModifier
      requestHeaderModifier:
        set:
        - name: X-Forwarded-Proto
          value: https
    backendRefs:
    - name: frontend-svc
      port: 80
{{- end }}
