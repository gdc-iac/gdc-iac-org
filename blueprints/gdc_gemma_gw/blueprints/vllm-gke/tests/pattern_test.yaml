suite: vllm-gke chart unit tests
templates:
  - templates/deployment.yaml
  - templates/service.yaml
  - templates/pvc.yaml
tests:
  - it: should render vLLM Deployment, Service, and PVC by default
    asserts:
      - hasDocuments:
          count: 1
        template: templates/deployment.yaml
      - isKind:
          of: Deployment
        template: templates/deployment.yaml
      - isKind:
          of: Service
        template: templates/service.yaml
      - isKind:
          of: PersistentVolumeClaim
        template: templates/pvc.yaml
  - it: should inject global.registry and global.namespace when provided by Helmfile Stage 5
    set:
      global.namespace: gemma-inference
      global.registry: harbor.corp.gdc.local/ai-models
    template: templates/deployment.yaml
    asserts:
      - equal:
          path: metadata.namespace
          value: gemma-inference
      - equal:
          path: spec.template.spec.containers[0].image
          value: harbor.corp.gdc.local/ai-models/vllm-openai:latest
  - it: should align Service name and pod selector labels with standalone gateway and envoy-inference-pool
    release:
      name: vllm-26b
    asserts:
      - equal:
          path: metadata.name
          value: vllm-26b-vllm-service
        template: templates/service.yaml
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/name"]
          value: vllm-gke
        template: templates/deployment.yaml
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/instance"]
          value: vllm-26b
        template: templates/deployment.yaml
