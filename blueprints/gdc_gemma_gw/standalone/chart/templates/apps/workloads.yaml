{{- if .Values.apps.enabled }}
{{- $registry := .Values.registry | default .Values.global.registry -}}
{{- if .Values.apps.createNamespace }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ include "gemma-standalone.namespace" . }}
  labels:
    environment: testing
    {{- include "gemma-standalone.labels" . | nindent 4 }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gemma-gateway
  namespace: {{ include "gemma-standalone.namespace" . }}
  labels:
    {{- include "gemma-standalone.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gemma-gateway
  template:
    metadata:
      labels:
        app: gemma-gateway
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
      - name: gateway
        image: {{ if $registry }}{{ $registry }}/{{ .Values.apps.imageName | default "gemma-proxy" }}:{{ .Values.apps.imageTag | default "latest" }}{{ else }}gemma-gateway:latest{{ end }}
        imagePullPolicy: {{ .Values.apps.imagePullPolicy | default "IfNotPresent" }}
        ports:
        - containerPort: 8080
        env:
        - name: ACTIVE_FRAMEWORK
          value: {{ .Values.apps.activeFramework | default "ollama" | quote }}
        - name: OLLAMA_MODEL_VARIANT
          value: {{ .Values.apps.ollamaModelVariant | default "26b" | quote }}
        - name: GATEWAY_TIMEOUT
          value: '300.0'
        - name: MODEL_ROUTING_CONFIG
          value: '{"gemma4:26b": "http://ollama-26b:11434", "gemma4:31b": "http://ollama-31b:11434", "*": "http://ollama-26b:11434"}'
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: gemma-gateway
  namespace: {{ include "gemma-standalone.namespace" . }}
  labels:
    {{- include "gemma-standalone.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 8080
  selector:
    app: gemma-gateway
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gemma-gateway-route
  namespace: {{ include "gemma-standalone.namespace" . }}
  labels:
    app.kubernetes.io/part-of: gemma-gateway
    {{- include "gemma-standalone.labels" . | nindent 4 }}
spec:
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: gdc-platform-gateway
    namespace: gemma-inference
  hostnames:
  - gemma-gateway.shared-services.gdc.local
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: gemma-gateway
      port: 80
{{- end }}
