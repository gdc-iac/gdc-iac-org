# Verified GDCag Helm values for upstream HashiCorp Vault chart 0.32.0 (Vault OSS 1.15.0)
# with GDCag KMS Auto-Unseal via the `gdc-kms-bridge` native sidecar.
#
# Registry notes (GDCag v1.16.2+):
# - Mirror OSS `vault:1.15.0` and `gdc-kms-bridge:1.0.0` to Project Managed Harbor
#   (e.g., `harbor001-<project>.org-12345.zone1.google.gdch.test/iac/...`) using `tools/mirror-images/`.
#   Do NOT push unsigned images to System Harbor `library/` (rejected with Cosign `412 Precondition Failed`),
#   and do NOT use `vault-enterprise` unless an Enterprise license secret is mounted.
# - `vault-k8s:1.7.2` can be pulled from System Harbor (`harbor.<org>.<zone>.google.gdch.test/library/hashicorp/vault-k8s:1.7.2`)
#   or mirrored into Project Managed Harbor (`<project-harbor>/iac/vault-k8s:1.7.2`).

global:
  enabled: true
  tlsDisable: true
  imagePullSecrets:
    - name: harbor-creds

injector:
  enabled: true
  affinity: ""
  image:
    repository: "harbor.gdc.local/iac/vault-k8s"
    tag: "1.7.2"
    pullPolicy: IfNotPresent
  agentImage:
    repository: "harbor.gdc.local/iac/vault"
    tag: "1.15.0"
  resources:
    requests:
      memory: 128Mi
      cpu: 100m
    limits:
      memory: 256Mi
      cpu: 250m

server:
  enabled: true
  image:
    repository: "harbor.gdc.local/iac/vault"
    tag: "1.15.0"
    pullPolicy: IfNotPresent
  updateStrategyType: "RollingUpdate"
  nodeSelector:
    pool: cpu
  affinity: |
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: {{ template "vault.name" . }}
                app.kubernetes.io/instance: "{{ .Release.Name }}"
                component: server
            topologyKey: kubernetes.io/hostname

  resources:
    requests:
      memory: 16Gi
      cpu: "4"
    limits:
      memory: 16Gi
      cpu: "4"

  readinessProbe:
    enabled: true
    path: "/v1/sys/health?standbyok=true&perfstandbyok=true"
  livenessProbe:
    enabled: true
    # `uninitok=true&sealedcode=204` prevents kubelet from restarting `vault-0` (HTTP 501) prior to `vault operator init`
    path: "/v1/sys/health?standbyok=true&uninitok=true&sealedcode=204"
    initialDelaySeconds: 60

  # Route Vault's built-in `seal "gcpckms"` gRPC & OAuth2 calls to the local `gdc-kms-bridge` sidecar
  hostAliases:
    - ip: "127.0.0.1"
      hostnames:
        - "cloudkms.googleapis.com"
        - "oauth2.googleapis.com"

  extraEnvironmentVars:
    GOOGLE_REGION: "zone1"
    GOOGLE_PROJECT: "my-gdc-project"
    GOOGLE_APPLICATION_CREDENTIALS: "/vault/kms-bridge/gcp-credentials.json"
    SSL_CERT_FILE: "/vault/kms-bridge/ca-certificates.crt"

  extraVolumes:
    - type: secret
      name: gdc-kms-sa

  volumes:
    - name: kms-bridge
      emptyDir:
        medium: Memory

  volumeMounts:
    - name: kms-bridge
      mountPath: /vault/kms-bridge
      readOnly: true

  extraInitContainers:
    - name: gdc-kms-bridge
      image: "harbor.gdc.local/iac/gdc-kms-bridge:1.0.0"
      imagePullPolicy: IfNotPresent
      restartPolicy: Always
      command: ["/usr/local/bin/gdc-kms-bridge"]
      securityContext:
        runAsNonRoot: false
        runAsUser: 0
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        seccompProfile:
          type: RuntimeDefault
        capabilities:
          drop: ["ALL"]
          add: ["NET_BIND_SERVICE"]
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 128Mi
      env:
        - name: GDC_SA_KEY_FILE
          value: "/vault/userconfig/gdc-kms-sa/vault-kms-sa.json"
        - name: GDC_KMS_ENDPOINT
          value: "https://kms.org-12345.zone1.google.gdch.test"
        - name: GOOGLE_PROJECT
          value: "my-gdc-project"
        - name: GDC_BRIDGE_SHARED_DIR
          value: "/vault/kms-bridge"
        - name: GDC_BRIDGE_LISTEN
          value: "127.0.0.1:443"
        - name: GDC_BRIDGE_HEALTH_LISTEN
          value: "0.0.0.0:18080"
      startupProbe:
        httpGet:
          path: /healthz
          port: 18080
        initialDelaySeconds: 1
        periodSeconds: 1
        failureThreshold: 15
      volumeMounts:
        - name: kms-bridge
          mountPath: /vault/kms-bridge
        - name: userconfig-gdc-kms-sa
          mountPath: /vault/userconfig/gdc-kms-sa
          readOnly: true

  dataStorage:
    enabled: true
    size: 50Gi
    mountPath: /vault/data
    storageClass: "standard-rwo"
    accessMode: ReadWriteOnce

  auditStorage:
    enabled: false

  standalone:
    enabled: false

  ha:
    enabled: true
    replicas: 3
    raft:
      enabled: true
      setNodeId: true
      config: |
        ui = true

        listener "tcp" {
          tls_disable = 1
          address = "[::]:8200"
          cluster_address = "[::]:8201"
        }

        storage "raft" {
          path = "/vault/data"
          retry_join {
            leader_api_addr = "http://vault-0.vault-internal:8200"
          }
          retry_join {
            leader_api_addr = "http://vault-1.vault-internal:8200"
          }
          retry_join {
            leader_api_addr = "http://vault-2.vault-internal:8200"
          }
        }

        # `gdc-kms-bridge` translates `keyRings/<project>/cryptoKeys/<key>` to
        # GDCag KMS camelCase `namespaces/<project>/aeadKeys/<key>`.
        seal "gcpckms" {
          project    = "my-gdc-project"
          region     = "zone1"
          key_ring   = "my-gdc-project"
          crypto_key = "vault-unseal-key"
        }

        service_registration "kubernetes" {}

ui:
  enabled: true
  serviceType: "ClusterIP"
