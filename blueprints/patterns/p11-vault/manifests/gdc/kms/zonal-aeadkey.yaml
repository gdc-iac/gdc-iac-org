# Apply against the Zone Management API server kubeconfig (`ZONE_KUBECONFIG` / `<org>-admin`):
#   kubectl --kubeconfig="${ZONE_KUBECONFIG}" apply -f manifests/gdc/kms/zonal-aeadkey.yaml
# Data-plane resource URI (camelCase `aeadKeys` required):
#   namespaces/my-gdc-project/aeadKeys/vault-unseal-key
apiVersion: kms.gdc.goog/v1
kind: AEADKey
metadata:
  name: vault-unseal-key
  namespace: my-gdc-project
spec:
  algorithm: AES_256_GCM
