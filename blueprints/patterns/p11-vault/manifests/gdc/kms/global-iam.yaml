# Apply against the Global API server kubeconfig (`GLOBAL_API_KUBECONFIG` / `global-api`):
#   kubectl --kubeconfig="${GLOBAL_API_KUBECONFIG}" apply -f manifests/gdc/kms/global-iam.yaml
apiVersion: resourcemanager.global.gdc.goog/v1
kind: ProjectServiceAccount
metadata:
  name: vault-kms-sa
  namespace: my-gdc-project
---
apiVersion: iam.global.gdc.goog/v1
kind: IAMRoleBinding
metadata:
  name: vault-kms-sa--kms-developer
  namespace: my-gdc-project
  labels:
    iam.global.gdc.goog/iam-role-name: kms-developer
spec:
  roleRef:
    apiGroup: iam.global.gdc.goog/v1
    kind: IAMRole
    name: kms-developer
  subjects:
    - kind: ServiceAccount
      name: vault-kms-sa
      namespace: my-gdc-project
---
apiVersion: iam.global.gdc.goog/v1
kind: IAMRoleBinding
metadata:
  name: vault-kms-sa--kms-viewer
  namespace: my-gdc-project
  labels:
    iam.global.gdc.goog/iam-role-name: kms-viewer
spec:
  roleRef:
    apiGroup: iam.global.gdc.goog/v1
    kind: IAMRole
    name: kms-viewer
  subjects:
    - kind: ServiceAccount
      name: vault-kms-sa
      namespace: my-gdc-project
