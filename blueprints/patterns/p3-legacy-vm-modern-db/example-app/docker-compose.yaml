version: '3.8'

services:
  postgres-mock:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: legacy_db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  legacy-vm-app:
    build: ./legacy-app
    environment:
      DB_HOST: postgres-mock
      DB_NAME: legacy_db
      DB_USER: postgres
      DB_PASS: password
    depends_on:
      postgres-mock:
        condition: service_healthy
