{{- if .Values.gdc.enabled }}
apiVersion: networking.gdc.goog/v1
kind: Network
metadata:
  name: vm-net
  namespace: {{ include "p3-legacy-vm-modern-db.namespace" . }}
  labels:
    {{- include "p3-legacy-vm-modern-db.labels" . | nindent 4 }}
---
apiVersion: v1
kind: Secret
metadata:
  name: db-pw-legacy-db
  namespace: {{ include "p3-legacy-vm-modern-db.namespace" . }}
  labels:
    {{- include "p3-legacy-vm-modern-db.labels" . | nindent 4 }}
type: Opaque
data:
  legacy-db: {{ (.Values.gdc.db.base64EncodedPassword | default "Q0hBTkdFX01FX0RCX0FETUlOX1BBU1NXT1JE") | quote }}
---
apiVersion: postgresql.dbadmin.gdc.goog/v1
kind: DBCluster
metadata:
  name: legacy-db
  namespace: {{ include "p3-legacy-vm-modern-db.namespace" . }}
  labels:
    {{- include "p3-legacy-vm-modern-db.labels" . | nindent 4 }}
spec:
  availability:
    enableHighAvailability: true
    enableAutoFailover: true
  primarySpec:
    adminUser:
      passwordRef:
        name: db-pw-legacy-db
    version: "15"
    resources:
      cpu: 4
      memory: 16Gi
      disks:
        - name: DataDisk
          size: 100Gi
---
apiVersion: virtualmachine.compute.gdc.goog/v1
kind: VirtualMachine
metadata:
  name: app-vm-01
  namespace: {{ include "p3-legacy-vm-modern-db.namespace" . }}
  labels:
    {{- include "p3-legacy-vm-modern-db.labels" . | nindent 4 }}
spec:
  compute:
    machineType: n2-highcpu-8-gdc
  storage:
    disks:
    - boot: true
      size: 10G
      source:
        image: projects/gradec-images/global/images/family/ubuntu-2004
  networkInterfaces:
  - subnetwork: vm-subnet
{{- end }}
