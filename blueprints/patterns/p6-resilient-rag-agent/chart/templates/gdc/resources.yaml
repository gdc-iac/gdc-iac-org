{{- if .Values.gdc.enabled }}
{{- $ns := include "p6-resilient-rag-agent.namespace" . -}}
{{- $projectId := include "p6-resilient-rag-agent.projectId" . -}}
apiVersion: v1
kind: Secret
metadata:
  name: db-pw-rag-db
  namespace: {{ $ns }}
  labels:
    {{- include "p6-resilient-rag-agent.labels" . | nindent 4 }}
type: Opaque
data:
  rag-db: {{ (.Values.gdc.db.base64EncodedPassword | default "Q0hBTkdFX01FX0RCX0FETUlOX1BBU1NXT1JE") | quote }}
---
apiVersion: postgresql.dbadmin.gdc.goog/v1
kind: DBCluster
metadata:
  name: rag-db
  namespace: {{ $ns }}
  labels:
    {{- include "p6-resilient-rag-agent.labels" . | nindent 4 }}
spec:
  availability:
    enableHighAvailability: true
    enableAutoFailover: true
  primarySpec:
    adminUser:
      passwordRef:
        name: db-pw-rag-db
    version: "15"
    resources:
      cpu: 4
      memory: 16Gi
      disks:
        - name: DataDisk
          size: 100Gi
---
apiVersion: iam.global.gdc.goog/v1
kind: IAMRoleBinding
metadata:
  name: rag-sa--project-bucket-object-admin
  namespace: {{ $projectId }}
  labels:
    iam.global.gdc.goog/iam-role-name: project-bucket-object-admin
    {{- include "p6-resilient-rag-agent.labels" . | nindent 4 }}
spec:
  roleRef:
    apiGroup: iam.global.gdc.goog/v1
    kind: IAMRole
    name: project-bucket-object-admin
  subjects:
    - kind: ServiceAccount
      name: rag-sa
      namespace: {{ $projectId }}
{{- end }}
