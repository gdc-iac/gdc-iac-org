apiVersion: v1
kind: Secret
metadata:
  name: db-pw-rag-db
  namespace: test-project # kpt-set: ${namespace}
type: Opaque
data:
  rag-db: "Q0hBTkdFX01FX0RCX0FETUlOX1BBU1NXT1JE"
---
apiVersion: postgresql.dbadmin.gdc.goog/v1
kind: DBCluster
metadata:
  name: rag-db
  namespace: test-project # kpt-set: ${namespace}
spec:
  availability:
    enableHighAvailability: true
    enableAutoFailover: true
  primarySpec:
    adminUser:
      passwordRef:
        name: db-pw-rag-db
    version: "15"
    resources:
      cpu: 4
      memory: 16Gi
      disks:
        - name: DataDisk
          size: 100Gi
