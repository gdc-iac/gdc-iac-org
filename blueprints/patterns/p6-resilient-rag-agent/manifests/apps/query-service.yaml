apiVersion: apps/v1
kind: Deployment
metadata:
  name: query-service
  namespace: test-project
spec:
  replicas: 1
  selector:
    matchLabels:
      app: query-service
  template:
    metadata:
      labels:
        app: query-service
    spec:
      serviceAccountName: rag-sa
      containers:
      - name: query-service
        image: us-central1-docker.pkg.dev/your-project-id/blueprint-images/rag-query:v7 # kpt-set: ${registry-host}/rag-query:v7
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        env:
        - name: DB_HOST
          valueFrom:
            secretKeyRef:
              name: rag-db-credentials
              key: host
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: rag-db-credentials
              key: username
        - name: DB_PASS
          valueFrom:
            secretKeyRef:
              name: rag-db-credentials
              key: password
        - name: DB_NAME
          value: "postgres"
        - name: LLM_PROVIDER
          value: "gemma"
        - name: LLM_GATEWAY_URL
          value: "http://gemma-gateway.gemma-inference.svc.cluster.local:80/v1" # kpt-set: http://gemma-gateway.${namespace}.svc.cluster.local:80/v1
        - name: GEMINI_ENDPOINT
          value: "http://gemma-gateway.gemma-inference.svc.cluster.local:80/v1"
        - name: GEMINI_MODEL
          value: "gemma-2-27b-it"
        - name: EMBEDDING_MODEL
          value: "text-embedding-004"
        - name: PROJECT_ID
          value: "your-project-id" # kpt-set: ${project-id}
        - name: AO_PROJECT_ID
          value: "projects/your-project-id" # kpt-set: projects/${project-id}
        - name: INPUT_BUCKET
          value: "gs://raw-docs-your-project-id" # kpt-set: gs://raw-docs-${project-id}
---
apiVersion: v1
kind: Service
metadata:
  name: query-service
  namespace: test-project
spec:
  selector:
    app: query-service
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8080
  type: ClusterIP
