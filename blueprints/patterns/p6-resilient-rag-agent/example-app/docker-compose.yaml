version: '3.8'

services:
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"

  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: rag_db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  mock-llm:
    build: ./mock-llm
    ports:
      - "8000:8000"

  ingestion:
    build: ./ingestion
    environment:
      DB_HOST: db
      DB_NAME: rag_db
      DB_USER: postgres
      DB_PASS: password
      S3_ENDPOINT: http://minio:9000
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
    depends_on:
      - db
      - minio

  query-service:
    build: ./query-service
    environment:
      DB_HOST: db
      DB_NAME: rag_db
      DB_USER: postgres
      DB_PASS: password
      LLM_URL: http://mock-llm:8000/generate
    ports:
      - "8080:8080"
    depends_on:
      - db
      - mock-llm
