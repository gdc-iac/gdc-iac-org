apiVersion: batch/v1
kind: CronJob
metadata:
  name: doc-ingest
  namespace: test-project
spec:
  schedule: "*/15 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: rag-sa  # Must match Step 1
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
          - name: ingest
            image: us-central1-docker.pkg.dev/your-project-id/blueprint-images/rag-ingest:v7
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
            env:
            - name: INPUT_BUCKET
              value: "gs://raw-docs-your-project-id"
            - name: DB_NAME
              value: "postgres"
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: rag-db-credentials
                  key: host
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: rag-db-credentials
                  key: username
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: rag-db-credentials
                  key: password
            volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: db-ca
              mountPath: /etc/db-tls
              readOnly: true
          volumes:
          - name: tmp
            emptyDir: {}
          - name: db-ca
            secret:
              secretName: rag-db-credentials
              optional: true
              items:
              - key: ca.crt
                path: ca.crt
          restartPolicy: OnFailure
