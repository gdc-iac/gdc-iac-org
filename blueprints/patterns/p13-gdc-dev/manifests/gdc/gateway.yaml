apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: gdc-dev-gateway-class
  namespace: gdc-dev
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: gdc-dev-gateway
  namespace: gdc-dev
  labels:
    app.kubernetes.io/name: gdc-dev
  annotations:
    networking.gke.io/load-balancer-type: "Internal"
spec:
  gatewayClassName: gdc-dev-gateway-class
  listeners:
  - name: http
    protocol: HTTP
    port: 80
    allowedRoutes:
      namespaces:
        from: Same
  - name: https-selfsigned
    protocol: HTTPS
    port: 443
    tls:
      mode: Terminate
      certificateRefs:
      - name: gdc-dev-selfsigned-cert-secret
    allowedRoutes:
      namespaces:
        from: Same
---
# HTTPRoute for GDC Dev Host Landing Page & Session Management
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gdc-dev-host-route
  namespace: gdc-dev
  labels:
    app.kubernetes.io/name: gdc-dev
spec:
  parentRefs:
  - name: gdc-dev-gateway
    namespace: gdc-dev
  hostnames:
  - "dev.gdc.local"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: gdc-dev-landing-page
      port: 8080
---
# HTTPRoute for Dynamic User Workspace Sessions (Shared Gateway Pattern)
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gdc-dev-session-route
  namespace: gdc-dev
  labels:
    app.kubernetes.io/name: gdc-dev
spec:
  parentRefs:
  - name: gdc-dev-gateway
    namespace: gdc-dev
  hostnames:
  - "dev.gdc.local"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /instances
    backendRefs:
    - name: gdc-dev-session-service
      port: 3000
