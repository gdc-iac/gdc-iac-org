apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gdc-dev-to-gemma-netpol
  namespace: gdc-dev
  labels:
    app.kubernetes.io/name: gdc-dev
    app.kubernetes.io/component: ai-integration
spec:
  podSelector:
    matchExpressions:
    - key: app
      operator: In
      values: ["gdc-dev-landing-page", "gdc-dev-operator"]
  policyTypes:
  - Egress
  egress:
  # 1. DNS Resolution in kube-system
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  # 2. Keycloak / Platform Egress
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: platform
    ports:
    - protocol: TCP
      port: 8080
  # 3. Gemma 4 Gateway & Keycloak in gemma-inference namespace
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: gemma-inference
    ports:
    - protocol: TCP
      port: 80
    - protocol: TCP
      port: 8080
    - protocol: TCP
      port: 8000
