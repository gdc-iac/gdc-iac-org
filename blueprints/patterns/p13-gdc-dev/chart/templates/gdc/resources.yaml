{{- if .Values.gdc.enabled }}
apiVersion: pki.security.gdc.goog/v1
kind: CertificateRequest
metadata:
  name: gdc-dev-cas-cert-req
  namespace: {{ include "p13-gdc-dev.namespace" . }}
  labels:
    app.kubernetes.io/name: gdc-dev
    app.kubernetes.io/component: phase3-pki-native
    {{- include "p13-gdc-dev.labels" . | nindent 4 }}
spec:
  certificateAuthorityRef:
    name: gdc-root-ca
    namespace: {{ include "p13-gdc-dev.namespace" . }}
  certificateConfig:
    subjectConfig:
      commonName: dev.gdc.local
      organization: Google Distributed Cloud Developer Services
      dnsNames:
      - dev.gdc.local
      - '*.dev.gdc.local'
  signedCertificateSecret: gdc-dev-tls-secret
  notAfter: '2027-01-01T00:00:00Z'
{{- end }}
