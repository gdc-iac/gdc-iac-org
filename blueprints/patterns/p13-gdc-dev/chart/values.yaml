# Global context parameters injected by the GDC IaC framework (Helmfile / ArgoCD)
global:
  projectId: "test-project"
  namespace: "test-project"
  registry: "harbor.gdc.local/blueprint-images"
  imagePullSecrets: []
  commonLabels: {}
  commonAnnotations: {}

# Fallback top-level namespace/registry for direct helm install
namespace: ""
registry: ""

# Control-plane execution gates:
# - Stage 2 (2-resources) provisions Zonal databases/VMs via core charts/gdc-dbs & charts/gdc-vm,
#   so gdc.enabled defaults to false for Stage 5 (5-workload-factory) User Cluster deployments.
# - Set gdc.enabled=true only when deploying GDC CRDs directly from this wrapper chart to a Zonal context.
gdc:
  enabled: false
  failover:
    enabled: false # Day-2 manual failover trigger; must remain false during normal sync

# User Cluster workload execution gate (Stage 5: 5-workload-factory)
apps:
  enabled: true

# Pattern 13 specific controls
phase: 3 # Deployment phase selector (1, 2, or 3)
auth:
  mode: "oidc" # Authentication mode: "oidc" or "mock"
  allowSimulatedOidc: "false"
  headerUserKey: "X-Forwarded-User"
  oidcAuthority: "https://keycloak.gdc.local/realms/gdc-dev-realm"
  oidcClientId: "gdc-dev-client"
  oidcRedirectUri: "https://dev.gdc.local/auth/callback"
ai:
  enabled: true # Enable AI gateway patch and network policy

# Dual Storage Architecture:
# - userWorkspace: Isolated ReadWriteOnce (standard-rwo) storage per developer workspace
# - sharedCodebase: Shared ReadWriteMany (standard-rwx) storage mounted at /workspace/shared for team Git/GitLab collaboration
storage:
  userWorkspace:
    storageClassName: "standard-rwo"
    size: "20Gi"
  sharedCodebase:
    enabled: true
    usePvc: false # Set to true on GDC-ag (or GKE with Filestore RWX) to provision gdc-dev-shared-codebase-pvc
    storageClassName: "standard-rwx"
    accessMode: "ReadWriteMany"
    size: "50Gi"
    mountPath: "/workspace/shared"
