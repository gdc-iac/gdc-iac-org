suite: p13-gdc-dev chart unit tests
templates:
  - templates/apps/workloads.yaml
  - templates/gdc/resources.yaml
tests:
  - it: should render User Cluster workloads by default with custom namespace and labels
    set:
      global:
        namespace: custom-tenant-ns
        projectId: custom-tenant-proj
        registry: harbor.corp.local/blueprints
    template: templates/apps/workloads.yaml
    asserts:
      - hasDocuments:
          count: 20
      - isKind:
          of: ConfigMap
        documentIndex: 0
  - it: should render shared codebase ReadWriteMany PVC when storage.sharedCodebase.usePvc is true
    set:
      storage:
        sharedCodebase:
          usePvc: true
          storageClassName: standard-rwx
          size: 50Gi
    template: templates/apps/workloads.yaml
    asserts:
      - hasDocuments:
          count: 21
      - isKind:
          of: PersistentVolumeClaim
        documentIndex: 8
  - it: should not render User Cluster workloads when apps.enabled is false
    set:
      apps:
        enabled: false
    template: templates/apps/workloads.yaml
    asserts:
      - hasDocuments:
          count: 0
  - it: should not render Zonal GDC resources by default (handled by Stage 2 2-resources)
    template: templates/gdc/resources.yaml
    asserts:
      - hasDocuments:
          count: 0
  - it: should render Zonal GDC resources when gdc.enabled is true
    set:
      gdc:
        enabled: true
      global:
        namespace: custom-tenant-ns
    template: templates/gdc/resources.yaml
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: CertificateRequest
        documentIndex: 0
