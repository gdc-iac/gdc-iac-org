apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  labels:
    app.kubernetes.io/component: storage
    app.kubernetes.io/instance: {{ .Values.notebook_name }}
    app.kubernetes.io/part-of: vtxwb
  name: {{ .Values.notebook_name }}
  namespace: {{ .Values.namespace }}
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.notebook_pvc_size }}
  storageClassName: standard-rwo