{{- if .Values.apps.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-consumer
  namespace: {{ include "p4-event-driven-kafka.namespace" . }}
  labels:
    {{- include "p4-event-driven-kafka.labels" . | nindent 4 }}
spec:
  replicas: 2
  selector:
    matchLabels:
      app: consumer
  template:
    metadata:
      labels:
        app: consumer
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
      - name: worker
        image: {{ include "p4-event-driven-kafka.registry" . }}/p4-consumer:v1
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        env:
        - name: KAFKA_BROKERS
          value: kafka-svc.test-project.svc.cluster.local:9092
        - name: DB_CONN
          valueFrom:
            secretKeyRef:
              name: event-db-credentials
              key: connection_string
        livenessProbe:
          exec:
            command:
            - cat
            - /tmp/healthy
          initialDelaySeconds: 5
          periodSeconds: 5
        readinessProbe:
          exec:
            command:
            - cat
            - /tmp/ready
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: {{ include "p4-event-driven-kafka.namespace" . }}
  labels:
    {{- include "p4-event-driven-kafka.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      app: kafka
  serviceName: kafka-svc
  replicas: 1
  template:
    metadata:
      labels:
        app: kafka
    spec:
      initContainers:
      - name: volume-permissions
        image: {{ include "p4-event-driven-kafka.registry" . }}/library/busybox:latest
        command:
        - sh
        - -c
        - chown -R 1000:1000 /mnt/kafka
        volumeMounts:
        - name: kafka-data
          mountPath: /mnt/kafka
      containers:
      - name: kafka
        image: {{ include "p4-event-driven-kafka.registry" . }}/library/apache/kafka:3.7.0
        ports:
        - containerPort: 9092
          name: client
        - containerPort: 9093
          name: controller
        env:
        - name: KAFKA_NODE_ID
          value: '0'
        - name: KAFKA_PROCESS_ROLES
          value: broker,controller
        - name: KAFKA_LISTENERS
          value: PLAINTEXT://:9092,CONTROLLER://:9093
        - name: KAFKA_ADVERTISED_LISTENERS
          value: PLAINTEXT://kafka-svc.test-project.svc.cluster.local:9092
        - name: KAFKA_CONTROLLER_LISTENER_NAMES
          value: CONTROLLER
        - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
          value: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
        - name: KAFKA_CONTROLLER_QUORUM_VOTERS
          value: 0@kafka-svc.test-project.svc.cluster.local:9093
        - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
          value: '1'
        - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
          value: '1'
        - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
          value: '1'
        - name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
          value: '0'
        - name: KAFKA_LOG_DIRS
          value: /mnt/kafka/data
        - name: CLUSTER_ID
          value: MkU3OEVBNTcwNTJENDM2Qk
        volumeMounts:
        - name: kafka-data
          mountPath: /mnt/kafka
  volumeClaimTemplates:
  - metadata:
      name: kafka-data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-svc
  namespace: {{ include "p4-event-driven-kafka.namespace" . }}
  labels:
    {{- include "p4-event-driven-kafka.labels" . | nindent 4 }}
spec:
  ports:
  - port: 9092
    name: client
    targetPort: 9092
  - port: 9093
    name: controller
    targetPort: 9093
  selector:
    app: kafka
  clusterIP: None
{{- end }}
