apiVersion: v1
kind: ServiceAccount
metadata:
  name: gdc-dev-operator-sa
  namespace: gdc-dev
  labels:
    app.kubernetes.io/name: gdc-dev
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: gdc-dev-operator-role
rules:
- apiGroups: [""]
  resources: ["pods", "configmaps"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: [""]
  resources: ["services", "namespaces"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["apps"]
  resources: ["deployments", "statefulsets"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["gateway.networking.k8s.io"]
  resources: ["httproutes"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: gdc-dev-operator-binding
subjects:
- kind: ServiceAccount
  name: gdc-dev-operator-sa
  namespace: gdc-dev
roleRef:
  kind: ClusterRole
  name: gdc-dev-operator-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gdc-dev-operator
  namespace: gdc-dev
  labels:
    app.kubernetes.io/name: gdc-dev-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gdc-dev-operator
  template:
    metadata:
      labels:
        app: gdc-dev-operator
    spec:
      serviceAccountName: gdc-dev-operator-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: operator
        image: us-central1-docker.pkg.dev/test-project/blueprint-images/gdc-dev-operator:latest # kpt-set: ${registry-host}/gdc-dev-operator:latest
        imagePullPolicy: Always
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        env:
        - name: AUTH_MODE
          valueFrom:
            configMapKeyRef:
              name: gdc-dev-mock-auth-config
              key: AUTH_MODE
        - name: MOCK_USER_ID
          valueFrom:
            configMapKeyRef:
              name: gdc-dev-mock-auth-config
              key: MOCK_USER_ID
        envFrom:
        - configMapRef:
            name: gdc-dev-mock-auth-config
        - configMapRef:
            name: gdc-dev-agent-config
            optional: true
        ports:
        - containerPort: 3000
          name: session
        - containerPort: 8080
          name: health
        volumeMounts:
        - name: tmp-dir
          mountPath: /tmp
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
      volumes:
      - name: tmp-dir
        emptyDir: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gdc-dev-landing-page
  namespace: gdc-dev
  labels:
    app.kubernetes.io/name: gdc-dev-landing-page
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gdc-dev-landing-page
  template:
    metadata:
      labels:
        app: gdc-dev-landing-page
    spec:
      serviceAccountName: gdc-dev-operator-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: landing-page
        image: us-central1-docker.pkg.dev/test-project/blueprint-images/gdc-dev-landing-page:latest # kpt-set: ${registry-host}/gdc-dev-landing-page:latest
        imagePullPolicy: Always
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        ports:
        - containerPort: 8080
          name: http
        - containerPort: 8081
          name: admin
        envFrom:
        - configMapRef:
            name: gdc-dev-mock-auth-config
        - configMapRef:
            name: gdc-dev-agent-config
            optional: true
        volumeMounts:
        - name: tmp-dir
          mountPath: /tmp
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 256Mi
      volumes:
      - name: tmp-dir
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: gdc-dev-landing-page
  namespace: gdc-dev
spec:
  selector:
    app: gdc-dev-landing-page
  ports:
  - name: http
    port: 8080
    targetPort: 8080
  - name: admin
    port: 8081
    targetPort: 8081
---
apiVersion: v1
kind: Service
metadata:
  name: gdc-dev-session-service
  namespace: gdc-dev
spec:
  selector:
    app: gdc-dev-operator
  ports:
  - port: 3000
    targetPort: 3000
