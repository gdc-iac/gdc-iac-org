apiVersion: apps/v1
kind: Deployment
metadata:
  name: gdc-dev-operator
  namespace: gdc-dev
  labels:
    app.kubernetes.io/name: gdc-dev-operator
    app.kubernetes.io/component: phase3-agentic
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gdc-dev-operator
  template:
    metadata:
      labels:
        app: gdc-dev-operator
    spec:
      serviceAccountName: gdc-dev-operator-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: operator
        image: us-central1-docker.pkg.dev/test-project/blueprint-images/gdc-dev-operator:latest # kpt-set: ${registry-host}/gdc-dev-operator:latest
        imagePullPolicy: Always
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        envFrom:
        - configMapRef:
            name: gdc-dev-oidc-auth-config
        - configMapRef:
            name: gdc-dev-agent-config
            optional: true
        - configMapRef:
            name: gdc-antigravity-notebook-config
            optional: true
        ports:
        - containerPort: 3000
          name: session
        - containerPort: 8080
          name: health
        volumeMounts:
        - name: tmp-dir
          mountPath: /tmp
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 1Gi
      volumes:
      - name: tmp-dir
        emptyDir: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gdc-dev-landing-page
  namespace: gdc-dev
  labels:
    app.kubernetes.io/name: gdc-dev-landing-page
    app.kubernetes.io/component: phase3-agentic
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gdc-dev-landing-page
  template:
    metadata:
      labels:
        app: gdc-dev-landing-page
    spec:
      serviceAccountName: gdc-dev-operator-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: landing-page
        image: us-central1-docker.pkg.dev/test-project/blueprint-images/gdc-dev-landing-page:latest # kpt-set: ${registry-host}/gdc-dev-landing-page:latest
        imagePullPolicy: Always
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        envFrom:
        - configMapRef:
            name: gdc-dev-oidc-auth-config
        - configMapRef:
            name: gdc-dev-agent-config
            optional: true
        - configMapRef:
            name: gdc-antigravity-notebook-config
            optional: true
        ports:
        - containerPort: 8080
          name: http
        - containerPort: 8081
          name: admin
        volumeMounts:
        - name: tmp-dir
          mountPath: /tmp
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
      volumes:
      - name: tmp-dir
        emptyDir: {}
