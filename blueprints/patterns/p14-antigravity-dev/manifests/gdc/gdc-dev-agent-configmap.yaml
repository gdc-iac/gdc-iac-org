# trivy:ignore:AVD-KSV-0109 Integer token count threshold (not a credential)
apiVersion: v1
kind: ConfigMap
metadata:
  name: gdc-dev-agent-config
  namespace: gdc-dev
  labels:
    app.kubernetes.io/name: gdc-dev
    app.kubernetes.io/component: ai-agentic-phase3
data:
  # Phase 3 Agentic Mode Activation
  AI_ENABLED: "true"
  AI_AGENT_MODE: "agentic"                 # "passive" (Phase 2 Co-pilot) vs "agentic" (Phase 3 ReAct Agent)
  AI_APPROVAL_POLICY: "selective"          # "selective" (read auto-approved, diff/exec prompted) vs "full_auto"
  AI_MAX_TURNS: "10"                       # Recursion ceiling to prevent runaway loops
  AI_REQUEST_TIMEOUT: "300"                # 5-minute timeout matching Gateway & Ollama 31B

  # Multi-Agent Swarm Specialization
  AI_SWARM_ENABLED: "true"
  AI_SWARM_ROLES: "architect,coder,reviewer"
  AI_DEFAULT_ROLE: "swarm"                 # "swarm" (autonomous collaboration), "architect", "coder", "reviewer"

  # Model Tiering & Providers (Dual Engine Alignment)
  AGY_BACKEND_MODE: "gdc_gemma_gw"         # "gdc_gemma_gw" (OpenAI /v1 gateway), "gdc_gemini" (GDC Gemini API), or "litert_on_device"
  AI_PROVIDER: "gemma"                     # "gemma" (air-gapped local GPU / OpenAI /v1) or "gemini" (GDC sovereign API)
  OPENAI_API_BASE_URL: "http://gemma-gateway.gemma-inference.svc.cluster.local/v1"

  # Tier 1 (Fast / Routine tasks & completions)
  AI_TIER1_MODEL: "gemma4:26b"             # Fast MoE variant (~4B active params)
  AI_GEMINI_TIER1_MODEL: "gemini-2.0-flash"

  # Tier 2 (Deep reasoning, multi-step ReAct loops, & terminal test repairs)
  AI_CODER_MODEL: "gemma4:31b"             # 31B Dense reasoning variant
  AI_DEFAULT_MODEL: "gemma4:31b"
  AI_GEMINI_TIER2_MODEL: "gemini-2.0-pro"

  # Native GDC Air-Gapped Gemini AI Gateway Settings (Used when AGY_BACKEND_MODE="gdc_gemini")
  GOOGLE_CLOUD_PROJECT: "gdc-dev"
  GOOGLE_CLOUD_LOCATION: "gdc-dev"
  GDC_GEMINI_BASE_URL: "https://gemini.gdc.local:443/v1/projects/gdc-dev/locations/gdc-dev"
  GDC_GEMINI_ENDPOINT: "https://gemini.gdc.local:443/v1/projects/gdc-dev/locations/gdc-dev/chat/completions"
  AI_GEMINI_MODEL: "gemini-3.5-flash"
  GDC_GEMINI_REASONING_EFFORT: "medium"

  # Sovereign Constraints & Proxy
  AI_VISION_TOKEN_BUDGET: "280"
  NO_PROXY: "*.gemma-inference.svc.cluster.local,*.gemma-inference,*.svc.cluster.local,localhost,127.0.0.1"
