{{- if .Values.apps.enabled }}
# trivy:ignore:AVD-KSV-0109 Integer token count thresholds (not credentials)
apiVersion: v1
kind: ConfigMap
metadata:
  name: gdc-dev-ai-config
  namespace: {{ include "p13-gdc-dev.namespace" . }}
  labels:
    app.kubernetes.io/name: gdc-dev
    app.kubernetes.io/component: ai-integration
    {{- include "p13-gdc-dev.labels" . | nindent 4 }}
data:
  AI_ENABLED: 'true'
  AGY_BACKEND_MODE: {{ (and .Values.ai .Values.ai.backendMode) | default "gdc_gemma_gw" | quote }}
  OPENAI_API_BASE_URL: {{ (and .Values.ai .Values.ai.openaiApiBaseUrl) | default "http://gemma-gateway.gemma-inference.svc.cluster.local/v1" }}
  AI_DEFAULT_MODEL: {{ (and .Values.ai .Values.ai.tier1Model) | default "gemma4:26b" }}
  AI_CODER_MODEL: {{ (and .Values.ai .Values.ai.coderModel) | default "gemma4:31b" }}
  AI_VISION_TOKEN_BUDGET: '280'
  AGY_SDK_ENABLED: 'true'
  JUPYTERLAB_ENABLED: 'true'
  COMPUTE_PROFILE: {{ .Values.computeProfile | default "cpu-gateway" | quote }}
  AGY_LIGHTWEIGHT_TOKEN_THRESHOLD: {{ (and .Values.antigravity .Values.antigravity.gatewayTokenThreshold) | default 40960 | quote }}
  LITERT_GPU_TOKEN_THRESHOLD: {{ (and .Values.antigravity .Values.antigravity.litertGpuTokenThreshold) | default 16384 | quote }}
  LITERT_MODEL_PATH: {{ (and .Values.antigravity .Values.antigravity.litertModelPath) | default "/opt/models/gemma4-26b/model.litertlm" | quote }}
  AGY_SKILLS_PATH: {{ (and .Values.antigravity .Values.antigravity.skillsPath) | default "/opt/p14-antigravity/skills" | quote }}
  AI_REQUEST_TIMEOUT: '300'
  NO_PROXY: {{ (and .Values.ai .Values.ai.noProxy) | default "*.gemma-inference.svc.cluster.local,*.gemma-inference,*.svc.cluster.local,localhost,127.0.0.1" | quote }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: gdc-dev-tls-cert
  namespace: {{ include "p13-gdc-dev.namespace" . }}
  labels:
    app.kubernetes.io/name: gdc-dev
    app.kubernetes.io/component: phase3-pki
    {{- include "p13-gdc-dev.labels" . | nindent 4 }}
spec:
  secretName: gdc-dev-tls-secret
  duration: 2160h
  renewBefore: 360h
  dnsNames:
  - {{ (and .Values.gateway .Values.gateway.domain) | default "dev.gdc.local" }}
  - {{ printf "*.%s" ((and .Values.gateway .Values.gateway.domain) | default "dev.gdc.local") | quote }}
  issuerRef:
    name: {{ (and .Values.gateway .Values.gateway.clusterIssuer) | default "gdc-ca-issuer" }}
    kind: ClusterIssuer
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: {{ (and .Values.gateway .Values.gateway.className) | default "gdc-dev-gateway-class" }}
  namespace: {{ include "p13-gdc-dev.namespace" . }}
  labels:
    {{- include "p13-gdc-dev.labels" . | nindent 4 }}
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ (and .Values.gateway .Values.gateway.name) | default "gdc-dev-gateway" }}
  namespace: {{ include "p13-gdc-dev.namespace" . }}
  labels:
    app.kubernetes.io/name: gdc-dev
    {{- include "p13-gdc-dev.labels" . | nindent 4 }}
  annotations:
    networking.gke.io/load-balancer-type: Internal
spec:
  gatewayClassName: {{ (and .Values.gateway .Values.gateway.className) | default "gdc-dev-gateway-class" }}
  listeners:
  - name: http
    protocol: HTTP
    port: 80
    allowedRoutes:
      namespaces:
        from: Same
  - name: admin
    protocol: HTTP
    port: 8081
    allowedRoutes:
      namespaces:
        from: Same
  - name: https-selfsigned
    protocol: HTTPS
    port: 443
    tls:
      mode: Terminate
      certificateRefs:
      - name: {{ (and .Values.gateway .Values.gateway.tlsSecretName) | default "gdc-dev-selfsigned-cert-secret" }}
    allowedRoutes:
      namespaces:
        from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gdc-dev-host-route
  namespace: {{ include "p13-gdc-dev.namespace" . }}
  labels:
    app.kubernetes.io/name: gdc-dev
    {{- include "p13-gdc-dev.labels" . | nindent 4 }}
spec:
  parentRefs:
  - name: {{ (and .Values.gateway .Values.gateway.name) | default "gdc-dev-gateway" }}
    namespace: {{ include "p13-gdc-dev.namespace" . }}
  hostnames:
  - {{ (and .Values.gateway .Values.gateway.domain) | default "dev.gdc.local" }}
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: gdc-dev-landing-page
      port: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gdc-dev-session-route
  namespace: {{ include "p13-gdc-dev.namespace" . }}
  labels:
    app.kubernetes.io/name: gdc-dev
    {{- include "p13-gdc-dev.labels" . | nindent 4 }}
spec:
  parentRefs:
  - name: {{ (and .Values.gateway .Values.gateway.name) | default "gdc-dev-gateway" }}
    namespace: {{ include "p13-gdc-dev.namespace" . }}
  hostnames:
  - {{ (and .Values.gateway .Values.gateway.domain) | default "dev.gdc.local" }}
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /instances
    backendRefs:
    - name: gdc-dev-session-service
      port: 3000
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gdc-dev-admin-route
  namespace: {{ include "p13-gdc-dev.namespace" . }}
  labels:
    app.kubernetes.io/name: gdc-dev
    {{- include "p13-gdc-dev.labels" . | nindent 4 }}
spec:
  parentRefs:
  - name: {{ (and .Values.gateway .Values.gateway.name) | default "gdc-dev-gateway" }}
    namespace: {{ include "p13-gdc-dev.namespace" . }}
  hostnames:
  - {{ (and .Values.gateway .Values.gateway.adminDomain) | default "admin.dev.gdc.local" }}
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: gdc-dev-landing-page
      port: 8081
---
# trivy:ignore:AVD-KSV-0109 Integer token count thresholds (not credentials)
apiVersion: v1
kind: ConfigMap
metadata:
  name: gdc-dev-agent-config
  namespace: {{ include "p13-gdc-dev.namespace" . }}
  labels:
    app.kubernetes.io/name: gdc-dev
    app.kubernetes.io/component: ai-agentic-phase3
    {{- include "p13-gdc-dev.labels" . | nindent 4 }}
data:
  AI_ENABLED: 'true'
  AI_AGENT_MODE: agentic
  AI_APPROVAL_POLICY: selective
  AI_MAX_TURNS: '10'
  AI_REQUEST_TIMEOUT: '300'
  AI_SWARM_ENABLED: 'true'
  AI_SWARM_ROLES: architect,coder,reviewer
  AI_DEFAULT_ROLE: swarm
  AGY_BACKEND_MODE: {{ (and .Values.ai .Values.ai.backendMode) | default "gdc_gemma_gw" | quote }}
  AI_PROVIDER: {{ (and .Values.ai .Values.ai.provider) | default "gemma" }}
  OPENAI_API_BASE_URL: {{ (and .Values.ai .Values.ai.openaiApiBaseUrl) | default "http://gemma-gateway.gemma-inference.svc.cluster.local/v1" }}
  AI_TIER1_MODEL: {{ (and .Values.ai .Values.ai.tier1Model) | default "gemma4:26b" }}
  AI_GEMINI_TIER1_MODEL: {{ (and .Values.ai .Values.ai.geminiTier1Model) | default "gemini-2.0-flash" }}
  AI_CODER_MODEL: {{ (and .Values.ai .Values.ai.coderModel) | default "gemma4:31b" }}
  AI_DEFAULT_MODEL: {{ (and .Values.ai .Values.ai.defaultModel) | default "gemma4:31b" }}
  AI_GEMINI_TIER2_MODEL: {{ (and .Values.ai .Values.ai.geminiTier2Model) | default "gemini-2.0-pro" }}
  AI_GEMINI_MODEL: {{ (and .Values.ai .Values.ai.geminiModel) | default "gemini-3.5-flash" }}
  GDC_GEMINI_BASE_URL: {{ (and .Values.ai .Values.ai.geminiBaseUrl) | default "https://gemini.gdc.local:443/v1/projects/gdc-dev/locations/gdc-dev" | quote }}
  GDC_GEMINI_ENDPOINT: {{ (and .Values.ai .Values.ai.geminiEndpoint) | default "https://gemini.gdc.local:443/v1/projects/gdc-dev/locations/gdc-dev/chat/completions" | quote }}
  AI_VISION_TOKEN_BUDGET: '280'
  SHARED_CODEBASE_ROOT: {{ (and .Values.storage .Values.storage.sharedCodebase .Values.storage.sharedCodebase.mountPath) | default "/workspace/shared" | quote }}
  NO_PROXY: {{ (and .Values.ai .Values.ai.noProxy) | default "*.gemma-inference.svc.cluster.local,*.gemma-inference,*.svc.cluster.local,localhost,127.0.0.1" | quote }}
---
{{- if and .Values.storage .Values.storage.sharedCodebase .Values.storage.sharedCodebase.usePvc }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gdc-dev-shared-codebase-pvc
  namespace: {{ include "p13-gdc-dev.namespace" . }}
  labels:
    app.kubernetes.io/name: gdc-dev
    app.kubernetes.io/component: shared-codebase-storage
    {{- include "p13-gdc-dev.labels" . | nindent 4 }}
spec:
  storageClassName: {{ .Values.storage.sharedCodebase.storageClassName | default "standard-rwx" | quote }}
  accessModes:
  - {{ .Values.storage.sharedCodebase.accessMode | default "ReadWriteMany" }}
  resources:
    requests:
      storage: {{ .Values.storage.sharedCodebase.size | default "50Gi" | quote }}
---
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gdc-dev-operator-sa
  namespace: {{ include "p13-gdc-dev.namespace" . }}
  labels:
    app.kubernetes.io/name: gdc-dev
    {{- include "p13-gdc-dev.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: gdc-dev-operator-role
  labels:
    {{- include "p13-gdc-dev.labels" . | nindent 4 }}
rules:
- apiGroups:
  - ''
  resources:
  - pods
  - configmaps
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
- apiGroups:
  - ''
  resources:
  - services
  - namespaces
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - apps
  resources:
  - deployments
  - statefulsets
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
- apiGroups:
  - gateway.networking.k8s.io
  resources:
  - httproutes
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: gdc-dev-operator-binding
  labels:
    {{- include "p13-gdc-dev.labels" . | nindent 4 }}
subjects:
- kind: ServiceAccount
  name: gdc-dev-operator-sa
  namespace: {{ include "p13-gdc-dev.namespace" . }}
roleRef:
  kind: ClusterRole
  name: gdc-dev-operator-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gdc-dev-operator
  namespace: {{ include "p13-gdc-dev.namespace" . }}
  labels:
    app.kubernetes.io/name: gdc-dev-operator
    {{- include "p13-gdc-dev.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gdc-dev-operator
  template:
    metadata:
      labels:
        app: gdc-dev-operator
    spec:
      serviceAccountName: gdc-dev-operator-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: operator
        image: {{ include "p13-gdc-dev.registry" . }}/gdc-dev-operator:latest
        imagePullPolicy: IfNotPresent
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        envFrom:
        - configMapRef:
            name: gdc-dev-oidc-auth-config
        - configMapRef:
            name: gdc-dev-ai-config
            optional: true
        - configMapRef:
            name: gdc-dev-agent-config
            optional: true
        ports:
        - containerPort: 3000
          name: session
        - containerPort: 8080
          name: health
        volumeMounts:
        - name: shared-codebase
          mountPath: {{ (and .Values.storage .Values.storage.sharedCodebase .Values.storage.sharedCodebase.mountPath) | default "/workspace/shared" | quote }}
        - name: tmp-dir
          mountPath: /tmp
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
      volumes:
      - name: shared-codebase
        {{- if and .Values.storage .Values.storage.sharedCodebase .Values.storage.sharedCodebase.usePvc }}
        persistentVolumeClaim:
          claimName: gdc-dev-shared-codebase-pvc
        {{- else }}
        emptyDir: {}
        {{- end }}
      - name: tmp-dir
        emptyDir: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gdc-dev-landing-page
  namespace: {{ include "p13-gdc-dev.namespace" . }}
  labels:
    app.kubernetes.io/name: gdc-dev-landing-page
    {{- include "p13-gdc-dev.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gdc-dev-landing-page
  template:
    metadata:
      labels:
        app: gdc-dev-landing-page
    spec:
      serviceAccountName: gdc-dev-operator-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: landing-page
        image: {{ include "p13-gdc-dev.registry" . }}/gdc-dev-landing-page:latest
        imagePullPolicy: IfNotPresent
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        ports:
        - containerPort: 8080
          name: http
        - containerPort: 8081
          name: admin
        envFrom:
        - configMapRef:
            name: gdc-dev-oidc-auth-config
        - configMapRef:
            name: gdc-dev-ai-config
            optional: true
        - configMapRef:
            name: gdc-dev-agent-config
            optional: true
        volumeMounts:
        - name: shared-codebase
          mountPath: {{ (and .Values.storage .Values.storage.sharedCodebase .Values.storage.sharedCodebase.mountPath) | default "/workspace/shared" | quote }}
        - name: tmp-dir
          mountPath: /tmp
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 256Mi
      volumes:
      - name: shared-codebase
        {{- if and .Values.storage .Values.storage.sharedCodebase .Values.storage.sharedCodebase.usePvc }}
        persistentVolumeClaim:
          claimName: gdc-dev-shared-codebase-pvc
        {{- else }}
        emptyDir: {}
        {{- end }}
      - name: tmp-dir
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: gdc-dev-landing-page
  namespace: {{ include "p13-gdc-dev.namespace" . }}
  labels:
    {{- include "p13-gdc-dev.labels" . | nindent 4 }}
spec:
  selector:
    app: gdc-dev-landing-page
  ports:
  - name: http
    port: 8080
    targetPort: 8080
  - name: admin
    port: 8081
    targetPort: 8081
---
apiVersion: v1
kind: Service
metadata:
  name: gdc-dev-session-service
  namespace: {{ include "p13-gdc-dev.namespace" . }}
  labels:
    {{- include "p13-gdc-dev.labels" . | nindent 4 }}
spec:
  selector:
    app: gdc-dev-operator
  ports:
  - port: 3000
    targetPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: gdc-dev-loadbalancer
  namespace: {{ include "p13-gdc-dev.namespace" . }}
  labels:
    app.kubernetes.io/name: gdc-dev
    app.kubernetes.io/component: ingress-loadbalancer
    {{- include "p13-gdc-dev.labels" . | nindent 4 }}
  annotations:
    networking.gke.io/load-balancer-type: Internal
spec:
  type: LoadBalancer
  selector:
    app: gdc-dev-landing-page
  ports:
  - name: http
    port: 80
    targetPort: 8080
    protocol: TCP
  - name: https
    port: 443
    targetPort: 8080
    protocol: TCP
  - name: admin
    port: 8081
    targetPort: 8081
    protocol: TCP
---
apiVersion: v1
kind: Namespace
metadata:
  name: gdc-dev
  labels:
    app.kubernetes.io/name: gdc-dev
    {{- include "p13-gdc-dev.labels" . | nindent 4 }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gdc-dev-to-gemma-netpol
  namespace: {{ include "p13-gdc-dev.namespace" . }}
  labels:
    app.kubernetes.io/name: gdc-dev
    app.kubernetes.io/component: ai-integration
    {{- include "p13-gdc-dev.labels" . | nindent 4 }}
spec:
  podSelector:
    matchExpressions:
    - key: app
      operator: In
      values:
      - gdc-dev-landing-page
      - gdc-dev-operator
  policyTypes:
  - Egress
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: platform
    ports:
    - protocol: TCP
      port: 8080
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: {{ (and .Values.ai .Values.ai.gatewayNamespace) | default "gemma-inference" }}
    ports:
    - protocol: TCP
      port: 80
    - protocol: TCP
      port: 443
    - protocol: TCP
      port: 8080
    - protocol: TCP
      port: 8000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gdc-dev-netpol
  namespace: {{ include "p13-gdc-dev.namespace" . }}
  labels:
    app.kubernetes.io/name: gdc-dev
    app.kubernetes.io/component: phase3-hardening
    {{- include "p13-gdc-dev.labels" . | nindent 4 }}
spec:
  podSelector:
    matchExpressions:
    - key: app
      operator: In
      values:
      - gdc-dev-landing-page
      - gdc-dev-operator
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: gdc-gateway-system
    - podSelector:
        matchLabels:
          app: gdc-dev-operator
    - podSelector:
        matchLabels:
          app: gdc-dev-landing-page
    ports:
    - protocol: TCP
      port: 8080
    - protocol: TCP
      port: 8081
    - protocol: TCP
      port: 3000
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: my-gdc-project
    ports:
    - protocol: TCP
      port: 80
    - protocol: TCP
      port: 443
    - protocol: TCP
      port: 8080
  - to:
    - podSelector:
        matchLabels:
          app: gdc-dev-operator
    - podSelector:
        matchLabels:
          app: gdc-dev-landing-page
    ports:
    - protocol: TCP
      port: 8080
    - protocol: TCP
      port: 8081
    - protocol: TCP
      port: 3000
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gdc-dev-oidc-auth-config
  namespace: {{ include "p13-gdc-dev.namespace" . }}
  labels:
    app.kubernetes.io/name: gdc-dev
    {{- include "p13-gdc-dev.labels" . | nindent 4 }}
data:
  AUTH_MODE: {{ (and .Values.auth .Values.auth.mode) | default "oidc" | quote }}
  ALLOW_SIMULATED_OIDC: {{ (and .Values.auth .Values.auth.allowSimulatedOidc) | default "false" | quote }}
  HEADER_USER_KEY: {{ (and .Values.auth .Values.auth.headerUserKey) | default "X-Forwarded-User" | quote }}
  OIDC_AUTHORITY: {{ (and .Values.auth .Values.auth.oidcAuthority) | default "https://keycloak.gdc.local/realms/gdc-dev-realm" | quote }}
  OIDC_CLIENT_ID: {{ (and .Values.auth .Values.auth.oidcClientId) | default "gdc-dev-client" | quote }}
  OIDC_REDIRECT_URI: {{ (and .Values.auth .Values.auth.oidcRedirectUri) | default "https://dev.gdc.local/auth/callback" | quote }}
{{- end }}
