suite: p1-resilient-3-tier-webapp chart unit tests
templates:
  - templates/apps/workloads.yaml
  - templates/gdc/resources.yaml
  - templates/gdc/failover.yaml
tests:
  - it: should render User Cluster workloads by default with custom namespace and labels
    set:
      global:
        namespace: custom-tenant-ns
        projectId: custom-tenant-proj
        registry: harbor.corp.local/blueprints
    template: templates/apps/workloads.yaml
    asserts:
      - hasDocuments:
          count: 7
      - isKind:
          of: Deployment
        documentIndex: 0
      - equal:
          path: spec.template.spec.containers[0].env[2].name
          value: DB_USER
        documentIndex: 0
      - equal:
          path: spec.template.spec.containers[0].env[2].valueFrom.secretKeyRef.name
          value: tier3-db-credentials
        documentIndex: 0
      - equal:
          path: spec.template.spec.containers[0].env[2].valueFrom.secretKeyRef.key
          value: username
        documentIndex: 0
      - isKind:
          of: Deployment
        documentIndex: 5
      - equal:
          path: spec.template.spec.securityContext.runAsNonRoot
          value: true
        documentIndex: 5
      - equal:
          path: spec.template.spec.securityContext.runAsUser
          value: 101
        documentIndex: 5
      - equal:
          path: spec.template.spec.securityContext.runAsGroup
          value: 101
        documentIndex: 5
      - equal:
          path: spec.template.spec.securityContext.fsGroup
          value: 101
        documentIndex: 5
      - equal:
          path: spec.template.spec.containers[0].env[0].value
          value: http://logic-svc.custom-tenant-ns.svc.cluster.local:8080
        documentIndex: 5
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[3].name
          value: nginx-conf
        documentIndex: 5
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[3].mountPath
          value: /etc/nginx/conf.d
        documentIndex: 5
  - it: should not render User Cluster workloads when apps.enabled is false
    set:
      apps:
        enabled: false
    template: templates/apps/workloads.yaml
    asserts:
      - hasDocuments:
          count: 0
  - it: should not render Zonal GDC resources by default (handled by Stage 2 2-resources)
    template: templates/gdc/resources.yaml
    asserts:
      - hasDocuments:
          count: 0
  - it: should render Zonal GDC resources when gdc.enabled is true
    set:
      gdc:
        enabled: true
      global:
        namespace: custom-tenant-ns
    template: templates/gdc/resources.yaml
    asserts:
      - hasDocuments:
          count: 2
      - isKind:
          of: Secret
        documentIndex: 0
      - equal:
          path: metadata.name
          value: db-pw-tier3-db
        documentIndex: 0
      - isKind:
          of: DBCluster
        documentIndex: 1
      - equal:
          path: metadata.name
          value: tier3-db
        documentIndex: 1
      - equal:
          path: spec.availability.enableHighAvailability
          value: true
        documentIndex: 1
      - equal:
          path: spec.primarySpec.version
          value: "15"
        documentIndex: 1
      - equal:
          path: spec.primarySpec.adminUser.passwordRef.name
          value: db-pw-tier3-db
        documentIndex: 1
  - it: should keep Day-2 Failover disabled even when gdc.enabled is true unless explicitly triggered
    set:
      gdc:
        enabled: true
        failover:
          enabled: false
    template: templates/gdc/failover.yaml
    asserts:
      - hasDocuments:
          count: 0
