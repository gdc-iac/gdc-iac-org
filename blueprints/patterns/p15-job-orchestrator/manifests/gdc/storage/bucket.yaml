# Stage 2 Zonal Management API (`MANAGEMENT_KUBECONFIG`):
# Retention-locked S3-compatible GDC Object Storage Bucket for redacted job logs,
# WAL failover envelopes, and pre-remediation KRM rollback snapshots.
apiVersion: object.gdc.goog/v1
kind: Bucket
metadata:
  name: p15-jobs-ledger
  namespace: test-project # kpt-set: ${namespace}
  labels:
    app.kubernetes.io/part-of: p15-job-orchestrator
    project: my-gdc-project
spec:
  description: "Immutable 400-day retention-locked ledger, WAL, and audit archive for p15-job-orchestrator"
  location: "zone1"
  storageClass: Standard
  bucketPolicy:
    corsPolicy:
      enableCorsPolicy: false
    lockingPolicy:
      defaultObjectRetentionDays: 400
