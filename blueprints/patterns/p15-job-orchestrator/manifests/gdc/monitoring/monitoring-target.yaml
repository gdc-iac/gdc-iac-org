# Stage 2 Zonal Management API (`MANAGEMENT_KUBECONFIG`):
# Configures GDC Managed Prometheus (`monitoring.gdc.goog/v1`) to scrape both:
#   - `p15-job-manager` metrics endpoint on `:8080/metrics`
#   - `workflow-controller` (Profile A Argo HA) metrics endpoint on `:9090/metrics`
apiVersion: monitoring.gdc.goog/v1
kind: MonitoringTarget
metadata:
  name: p15-job-manager-metrics
  namespace: test-project # kpt-set: ${namespace}
  labels:
    app.kubernetes.io/part-of: p15-job-orchestrator
spec:
  selector:
    matchLabels:
      app: p15-job-manager
  podMetricsEndpoints:
    port:
      value: 8080
    path:
      value: /metrics
    scheme:
      value: http
    scrapeInterval: 30s
---
apiVersion: monitoring.gdc.goog/v1
kind: MonitoringTarget
metadata:
  name: p15-argo-workflow-controller-metrics
  namespace: test-project # kpt-set: ${namespace}
  labels:
    app.kubernetes.io/part-of: p15-job-orchestrator
spec:
  selector:
    matchLabels:
      app: workflow-controller
  podMetricsEndpoints:
    port:
      value: 9090
    path:
      value: /metrics
    scheme:
      value: http
    scrapeInterval: 30s
