# ==============================================================================
# CRITICAL DEP ORDERING REQUIREMENT (`GLOBAL_KUBECONFIG` — APPLY STEP 1 OF 2):
#
# Operators MUST apply this Intra-Project Egress `ProjectNetworkPolicy` FIRST BEFORE
# disabling Data Exfiltration Protection (DEP) on the project and BEFORE applying
# `pnp-cross-project.yaml`!
#
# Why: Disabling DEP on a GDC-ag project switches project-level egress enforcement to
# default-deny. If DEP is disabled before intra-project egress is explicitly permitted,
# all intra-project `ClusterIP` communication—including `p15-job-manager` -> `DBCluster`,
# `workflow-controller` -> Kubernetes API, and worker -> `p15-job-manager` callbacks—will
# be blackholed immediately.
#
# Safe Execution Sequence:
#   1. kubectl --kubeconfig=${GLOBAL_KUBECONFIG} apply -f manifests/gdc/network/pnp-intra-project-egress.yaml
#   2. Disable DEP on project `my-gdc-project` via gdcloud / Global Project policy
#   3. kubectl --kubeconfig=${GLOBAL_KUBECONFIG} apply -f manifests/gdc/network/pnp-cross-project.yaml
#
# OPA `policy/security.rego` Compliance: Zero `0.0.0.0/0` CIDRs permitted.
# ==============================================================================
apiVersion: networking.global.gdc.goog/v1
kind: ProjectNetworkPolicy
metadata:
  name: allow-p15-intra-project-egress
  namespace: test-project # kpt-set: ${namespace}
  labels:
    app.kubernetes.io/part-of: p15-job-orchestrator
    networking.gdc.goog/step-order: "1-before-dep-disable"
spec:
  subject:
    subjectType: UserWorkload
    userWorkloadSelector:
      labelSelector:
        workloads:
          matchLabels:
            app.kubernetes.io/part-of: p15-job-orchestrator
  ingress:
    - from:
        - projectSelector:
            projects:
              matchNames:
                - my-gdc-project
      ports:
        - port: 5432
          protocol: TCP
        - port: 8080
          protocol: TCP
        - port: 8081
          protocol: TCP
        - port: 9090
          protocol: TCP
        - port: 9091
          protocol: TCP
  egress:
    - to:
        - projectSelector:
            projects:
              matchNames:
                - my-gdc-project
      ports:
        - port: 443
          protocol: TCP
        - port: 5432
          protocol: TCP
        - port: 6443
          protocol: TCP
        - port: 8080
          protocol: TCP
        - port: 8081
          protocol: TCP
        - port: 9090
          protocol: TCP
        - port: 9091
          protocol: TCP
