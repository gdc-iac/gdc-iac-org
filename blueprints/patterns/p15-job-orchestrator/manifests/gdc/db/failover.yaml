# Day-2 Operational Drill ONLY (`MANAGEMENT_KUBECONFIG`):
# Triggers a controlled primary/standby switchover on DBCluster `p15-jobs-db` to validate
# WAL-first Object Storage catch-up and `< 15s` connection pool recovery.
# Do NOT include in automated continuous Stage 2 reconciliation (`gdc.failover.enabled: false`).
apiVersion: fleet.dbadmin.gdc.goog/v1
kind: Failover
metadata:
  name: trigger-failover-p15-jobs-db
  namespace: test-project # kpt-set: ${namespace}
  labels:
    app.kubernetes.io/part-of: p15-job-orchestrator
spec:
  dbclusterRef: p15-jobs-db
