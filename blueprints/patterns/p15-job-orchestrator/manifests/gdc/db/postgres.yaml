# Stage 2 Zonal Management API (`MANAGEMENT_KUBECONFIG`):
# Managed PostgreSQL 15 High-Availability DBCluster for p15-job-orchestrator (`platform_jobs` ledger & outbox).
# Replace the placeholder admin password prior to production apply.
apiVersion: v1
kind: Secret
metadata:
  name: db-pw-p15-jobs-db
  namespace: test-project # kpt-set: ${namespace}
  labels:
    app.kubernetes.io/part-of: p15-job-orchestrator
type: Opaque
data:
  p15-jobs-db: "Q0hBTkdFX01FX0RCX0FETUlOX1BBU1NXT1JE"
---
apiVersion: postgresql.dbadmin.gdc.goog/v1
kind: DBCluster
metadata:
  name: p15-jobs-db
  namespace: test-project # kpt-set: ${namespace}
  labels:
    app.kubernetes.io/part-of: p15-job-orchestrator
    project: my-gdc-project
spec:
  availability:
    enableHighAvailability: true
    enableAutoFailover: true
  primarySpec:
    adminUser:
      passwordRef:
        name: db-pw-p15-jobs-db
    version: "15"
    resources:
      cpu: 2
      memory: 8Gi
      disks:
        - name: DataDisk
          size: 100Gi
