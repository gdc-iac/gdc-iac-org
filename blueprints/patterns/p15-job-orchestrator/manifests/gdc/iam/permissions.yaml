# Apply ProjectServiceAccount and IAMRoleBinding on Global API (`GLOBAL_KUBECONFIG`):
# Grants `p15-jobs-sa` object read/write access to the retention-locked `p15-jobs-ledger` bucket.
apiVersion: resourcemanager.global.gdc.goog/v1
kind: ProjectServiceAccount
metadata:
  name: p15-jobs-sa
  namespace: test-project # kpt-set: ${namespace}
  labels:
    app.kubernetes.io/part-of: p15-job-orchestrator
    project: my-gdc-project
---
apiVersion: iam.global.gdc.goog/v1
kind: IAMRoleBinding
metadata:
  name: p15-jobs-sa--project-bucket-object-admin
  namespace: test-project # kpt-set: ${namespace}
  labels:
    app.kubernetes.io/part-of: p15-job-orchestrator
    iam.global.gdc.goog/iam-role-name: project-bucket-object-admin
spec:
  roleRef:
    apiGroup: iam.global.gdc.goog/v1
    kind: IAMRole
    name: project-bucket-object-admin
  subjects:
    - kind: ServiceAccount
      name: p15-jobs-sa
      namespace: test-project # kpt-set: ${namespace}
