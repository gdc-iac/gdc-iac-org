# ==============================================================================
# Stage 2 Zonal Management API (`MANAGEMENT_KUBECONFIG`):
# Dedicated Standard Cluster (`cluster.gdc.goog/v1`) for Profile A (`engine.mode: "argo"`).
#
# Why Dedicated Standard Cluster for Profile A?
# GDC-ag Shared Clusters (`namespace: platform`) prohibit tenant-installed CRDs (`*.argoproj.io`).
# Provisioning a dedicated project-scoped Standard Cluster allows Platform Administrators and
# Application Operators to install Argo Workflows HA CRDs while keeping worker nodes isolated.
# (Teams operating on an existing Shared Cluster should omit this manifest and deploy Profile B
# with `engine.mode: "k8s-native"`, which uses 0 CRDs and 0 ClusterRoles.)
#
# StandardClusterRoleBinding (`iam.gdc.goog/v1`) Note:
# After the Standard Cluster reconciles to `Ready`, bind authorised AO/PA identity groups via
# `StandardClusterRoleBinding` (`apiVersion: iam.gdc.goog/v1`) on the Zonal Management API:
#
#   apiVersion: iam.gdc.goog/v1
#   kind: StandardClusterRoleBinding
#   metadata:
#     name: p15-ao-standard-cluster-user
#     namespace: test-project
#   spec:
#     clusterSelector:
#       matchNames:
#         - name: p15-standard-jobs-cluster
#     roleRef:
#       apiGroup: iam.gdc.goog/v1
#       kind: ClusterRole
#       name: standard-cluster-developer
#     subjects:
#       - kind: Group
#         name: ao-job-operator-my-gdc-project
# ==============================================================================
apiVersion: cluster.gdc.goog/v1
kind: Cluster
metadata:
  name: p15-standard-jobs-cluster
  namespace: test-project # kpt-set: ${namespace}
  labels:
    app.kubernetes.io/part-of: p15-job-orchestrator
    project: my-gdc-project
spec:
  clusterNetwork:
    podCIDRSize: 21
    serviceCIDRSize: 23
  initialVersion:
    kubernetesVersion: "1.28.5-gke.1200"
  nodePools:
    - name: jobs-cpu-pool
      machineTypeName: n2-standard-4-gdc
      nodeCount: 2
      labels:
        app: p15-jobs
        pool: cpu
  releaseChannel:
    channel: UNSPECIFIED
