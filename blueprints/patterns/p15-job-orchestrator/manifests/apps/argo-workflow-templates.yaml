  timezone: "UTC"
  concurrencyPolicy: "Forbid"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  workflowSpec:
    priorityClassName: p15-ao-standard
    serviceAccountName: p15-pa-watcher-sa
    securityContext:
      runAsNonRoot: true
      runAsUser: 65532
      runAsGroup: 65532
      fsGroup: 65532
      seccompProfile:
        type: RuntimeDefault
    workflowTemplateRef:
      name: gdc-standard-job-runner-v1
      clusterScope: true
    arguments:
      parameters:
        - name: mode
          value: "monitor-platform-hygiene"
        - name: job_id
          value: "pa-hygiene-10m"
        - name: shard_key
          value: "cluster-wide"
        - name: sink_uri
          value: ""
        - name: enforcement_mode
          value: "audit"
        - name: worker_image
          value: "harbor.gdc.local/blueprint-images/p15-reference-worker:v1.0.0"
---
apiVersion: argoproj.io/v1alpha1
kind: CronWorkflow
metadata:
  name: p15-enforce-resource-policy
  namespace: test-project
  labels:
    app.kubernetes.io/part-of: p15-job-orchestrator
    p15.gdc.goog/job-class: enforce
spec:
  schedule: "0 * * * *"
  timezone: "UTC"
  concurrencyPolicy: "Forbid"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  workflowSpec:
    priorityClassName: p15-pa-critical
    serviceAccountName: p15-pa-watcher-sa
    securityContext:
      runAsNonRoot: true
      runAsUser: 65532
      runAsGroup: 65532
      fsGroup: 65532
      seccompProfile:
        type: RuntimeDefault
    workflowTemplateRef:
      name: gdc-standard-job-runner-v1
      clusterScope: true
    arguments:
      parameters:
        - name: mode
          value: "enforce-resource-policy"
        - name: job_id
          value: "pa-policy-enforcer-1h"
        - name: shard_key
          value: "namespace-test-project"
        - name: sink_uri
          value: ""
        - name: enforcement_mode
          value: "audit"
        - name: worker_image
          value: "harbor.gdc.local/blueprint-images/p15-reference-worker:v1.0.0"
