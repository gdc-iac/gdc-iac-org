apiVersion: batch/v1
kind: CronJob
metadata:
  name: p15-batch-watermarked-rollup
  namespace: {{ $ns }}
  labels:
    {{- include "p15-job-orchestrator.labels" . | nindent 4 }}
spec:
  schedule: "*/15 * * * *"
  timeZone: "UTC"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 86400
      backoffLimit: 4
      activeDeadlineSeconds: 900
      template:
        spec:
          serviceAccountName: p15-ao-worker-sa
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            fsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: worker
              image: {{ $registry }}/p15-reference-worker:{{ .Values.jobManager.workerImageTag }}
              args:
                - "--mode"
                - "batch-watermarked-rollup"
                - "--job-id"
                - "p15-batch-watermarked-rollup"
                - "--run-id"
                - "$(POD_NAME)"
                - "--enforcement-mode"
                - "audit"
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                runAsUser: 65532
                runAsGroup: 65532
                capabilities:
                  drop:
                    - ALL
              env:
                - name: POD_NAME
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.name
                - name: NAMESPACE
                  value: {{ $ns | quote }}
                - name: S3_ENDPOINT
                  value: {{ .Values.storage.s3Endpoint | quote }}
                - name: BUCKET_NAME
                  value: {{ .Values.storage.bucketName | quote }}
                - name: AWS_CA_BUNDLE
                  value: /etc/gdc-certs/ca.crt
              envFrom:
                - configMapRef:
                    name: p15-job-manager-config
                    optional: true
                - secretRef:
                    name: p15-db-credentials
                    optional: true
                - secretRef:
                    name: p15-s3-credentials
                    optional: true
              resources:
                requests:
                  cpu: "100m"
                  memory: "128Mi"
                limits:
                  cpu: "500m"
                  memory: "512Mi"
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
                - name: appuser-home
                  mountPath: /home/appuser
                - name: gdc-certs
                  mountPath: /etc/gdc-certs
                  readOnly: true
          volumes:
            - name: tmp
              emptyDir: {}
            - name: appuser-home
              emptyDir: {}
            - name: gdc-certs
              secret:
                secretName: gdc-ca-bundle
                optional: true
