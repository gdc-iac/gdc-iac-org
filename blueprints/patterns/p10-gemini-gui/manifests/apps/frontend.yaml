apiVersion: apps/v1
kind: Deployment
metadata:
  name: p10-frontend
  namespace: test-project
spec:
  replicas: 1
  selector:
    matchLabels:
      app: p10-frontend
  template:
    metadata:
      labels:
        app: p10-frontend
    spec:
      containers:
      - name: p10-frontend
        image: us-central1-docker.pkg.dev/test-project/blueprint-images/p10-frontend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80
        env:
        - name: VITE_API_URL
          value: "/api"
---
apiVersion: v1
kind: Service
metadata:
  name: p10-frontend-svc
  namespace: test-project
spec:
  selector:
    app: p10-frontend
  ports:
  - port: 80
    targetPort: 80
  type: LoadBalancer # Or ClusterIP with Ingress
