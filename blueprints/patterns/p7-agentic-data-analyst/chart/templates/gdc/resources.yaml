{{- if .Values.gdc.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: db-pw-postgres-db
  namespace: {{ include "p7-agentic-data-analyst.namespace" . }}
  labels:
    {{- include "p7-agentic-data-analyst.labels" . | nindent 4 }}
type: Opaque
data:
  postgres-db: {{ (.Values.gdc.db.base64EncodedPassword | default "Q0hBTkdFX01FX0RCX0FETUlOX1BBU1NXT1JE") | quote }}
---
apiVersion: postgresql.dbadmin.gdc.goog/v1
kind: DBCluster
metadata:
  name: postgres-db
  namespace: {{ include "p7-agentic-data-analyst.namespace" . }}
  labels:
    {{- include "p7-agentic-data-analyst.labels" . | nindent 4 }}
spec:
  availability:
    enableHighAvailability: true
    enableAutoFailover: true
  primarySpec:
    adminUser:
      passwordRef:
        name: db-pw-postgres-db
    version: "15"
    resources:
      cpu: 2
      memory: 8Gi
      disks:
        - name: DataDisk
          size: 50Gi
{{- end }}
