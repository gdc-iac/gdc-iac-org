version: '3.8'

services:
  db:
    image: postgres:14-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: analytics_db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  mock-llm:
    build: ./mock-llm
    ports:
      - "8000:8000"

  agent:
    build: ./agent
    environment:
      DB_HOST: db
      DB_NAME: analytics_db
      DB_USER: postgres
      DB_PASS: password
      LLM_URL: http://mock-llm:8000/generate
    volumes:
      - ./output:/output
    depends_on:
      - db
      - mock-llm
