suite: p12-keycloak chart unit tests
templates:
  - templates/apps/workloads.yaml
  - templates/gdc/resources.yaml
  - templates/gdc/failover.yaml
tests:
  - it: should render User Cluster workloads by default with custom namespace and labels
    set:
      global:
        namespace: custom-tenant-ns
        projectId: custom-tenant-proj
        registry: harbor.corp.local/blueprints
    template: templates/apps/workloads.yaml
    asserts:
      - hasDocuments:
          count: 2
      - isKind:
          of: Deployment
        documentIndex: 0
      - equal:
          path: spec.template.spec.initContainers[0].name
          value: init-keycloak-quarkus
        documentIndex: 0
      - equal:
          path: spec.template.spec.initContainers[0].image
          value: harbor.corp.local/blueprints/keycloak/keycloak:24.0.4
        documentIndex: 0
      - equal:
          path: spec.template.spec.initContainers[0].securityContext.readOnlyRootFilesystem
          value: true
        documentIndex: 0
      - equal:
          path: spec.template.spec.initContainers[0].securityContext.runAsNonRoot
          value: true
        documentIndex: 0
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[2].name
          value: keycloak-quarkus
        documentIndex: 0
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[2].mountPath
          value: /opt/keycloak/lib/quarkus
        documentIndex: 0
  - it: should support keycloak.db.existingSecret and extraVolumes for GDCag DBCluster TLS CA
    set:
      keycloak:
        db:
          existingSecret: keycloak-db-secret
        extraVolumes:
          - name: keycloak-db-ca
            secret:
              secretName: keycloak-db-ca
        extraVolumeMounts:
          - name: keycloak-db-ca
            mountPath: /etc/keycloak/db-ca
            readOnly: true
    template: templates/apps/workloads.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[1].valueFrom.secretKeyRef.name
          value: keycloak-db-secret
        documentIndex: 0
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[3].mountPath
          value: /etc/keycloak/db-ca
        documentIndex: 0
      - equal:
          path: spec.template.spec.volumes[3].secret.secretName
          value: keycloak-db-ca
        documentIndex: 0
  - it: should not render User Cluster workloads when apps.enabled is false
    set:
      apps:
        enabled: false
    template: templates/apps/workloads.yaml
    asserts:
      - hasDocuments:
          count: 0
  - it: should not render Zonal GDC resources by default (handled by Stage 2 2-resources)
    template: templates/gdc/resources.yaml
    asserts:
      - hasDocuments:
          count: 0
  - it: should render Zonal GDC resources when gdc.enabled is true
    set:
      gdc:
        enabled: true
      global:
        namespace: custom-tenant-ns
    template: templates/gdc/resources.yaml
    asserts:
      - hasDocuments:
          count: 2
      - isKind:
          of: Secret
        documentIndex: 0
      - equal:
          path: metadata.name
          value: db-pw-keycloak-db
        documentIndex: 0
      - isKind:
          of: DBCluster
        documentIndex: 1
      - equal:
          path: metadata.name
          value: keycloak-db
        documentIndex: 1
      - equal:
          path: spec.availability.enableHighAvailability
          value: true
        documentIndex: 1
      - equal:
          path: spec.primarySpec.version
          value: "15"
        documentIndex: 1
      - equal:
          path: spec.primarySpec.adminUser.passwordRef.name
          value: db-pw-keycloak-db
        documentIndex: 1
  - it: should keep Day-2 Failover disabled even when gdc.enabled is true unless explicitly triggered
    set:
      gdc:
        enabled: true
        failover:
          enabled: false
    template: templates/gdc/failover.yaml
    asserts:
      - hasDocuments:
          count: 0
