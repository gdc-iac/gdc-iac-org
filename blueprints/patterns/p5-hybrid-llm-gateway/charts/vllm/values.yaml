replicaCount: 1

image:
  repository: vllm/vllm-openai
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8000

model:
  name: "TinyLlama/TinyLlama-1.1B-Chat-v1.0" 
  maxModelLen: 2048 # Adjust based on GPU VRAM (4096 or more is better if VRAM allows)
  gpuMemoryUtilization: 0.95
  hfToken: "" # Optional Hugging Face Token (if using gated models like Gemma)

resources:
  limits:
    nvidia.com/gpu: 1
