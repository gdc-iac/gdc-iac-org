apiVersion: v1
kind: ServiceAccount
metadata:
  name: gateway-sa
  namespace: test-project # kpt-set: ${namespace}
  annotations:
    iam.gke.io/gcp-service-account: gateway-sa@your-project-id.iam.gserviceaccount.com # kpt-set: gateway-sa@${project-id}.iam.gserviceaccount.com
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-conf
  namespace: test-project # kpt-set: ${namespace}
data:
  PROJECT_ID: "your-project-id" # kpt-set: ${project-id}
  REGION: "us-central1"
  GEMINI_MODEL: "gemini-2.5-flash"
  # Optional: For testing on standard GCP Vertex AI (auto-discovered if empty)
  # GEMINI_ENDPOINT: "" 
  FAILOVER_URL: "http://ollama.test-project.svc.cluster.local:11434/api/generate" # kpt-set: http://ollama.${namespace}.svc.cluster.local:11434/api/generate
  FAILOVER_MODEL: "gemma:7b"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-gateway
  namespace: test-project # kpt-set: ${namespace}
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      serviceAccountName: gateway-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
      - name: proxy
        image: us-central1-docker.pkg.dev/your-project-id/blueprint-images/p5-gateway:latest # kpt-set: ${registry-host}/p5-gateway:latest
        imagePullPolicy: Always
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        envFrom:
        - configMapRef:
            name: gateway-conf
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe: # Changed from /ready to /health
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: llm-gateway
  namespace: test-project # kpt-set: ${namespace}
spec:
  selector:
    app: gateway
  ports:
  - port: 80
    targetPort: 8080
