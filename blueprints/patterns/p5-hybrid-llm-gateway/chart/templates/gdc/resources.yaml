{{- if .Values.gdc.enabled }}
apiVersion: iam.gdc.goog/v1
kind: ProjectPolicy
metadata:
  name: gateway-bindings
  namespace: {{ include "p5-hybrid-llm-gateway.namespace" . }}
  labels:
    {{- include "p5-hybrid-llm-gateway.labels" . | nindent 4 }}
spec:
  bindings:
  - role: Role/ai-invoker
    members:
    - serviceAccount:gateway-sa
{{- end }}
