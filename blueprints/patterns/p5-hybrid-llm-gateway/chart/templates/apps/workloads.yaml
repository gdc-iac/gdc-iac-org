{{- if .Values.apps.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gateway-sa
  namespace: {{ include "p5-hybrid-llm-gateway.namespace" . }}
  annotations:
    iam.gke.io/gcp-service-account: gateway-sa@your-project-id.iam.gserviceaccount.com
  labels:
    {{- include "p5-hybrid-llm-gateway.labels" . | nindent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-conf
  namespace: {{ include "p5-hybrid-llm-gateway.namespace" . }}
  labels:
    {{- include "p5-hybrid-llm-gateway.labels" . | nindent 4 }}
data:
  PROJECT_ID: your-project-id
  REGION: us-central1
  GEMINI_MODEL: gemini-2.5-flash
  FAILOVER_URL: http://ollama.test-project.svc.cluster.local:11434/api/generate
  FAILOVER_MODEL: gemma:7b
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-gateway
  namespace: {{ include "p5-hybrid-llm-gateway.namespace" . }}
  labels:
    {{- include "p5-hybrid-llm-gateway.labels" . | nindent 4 }}
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      serviceAccountName: gateway-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
      - name: proxy
        image: {{ include "p5-hybrid-llm-gateway.registry" . }}/p5-gateway:latest
        imagePullPolicy: Always
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        envFrom:
        - configMapRef:
            name: gateway-conf
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: llm-gateway
  namespace: {{ include "p5-hybrid-llm-gateway.namespace" . }}
  labels:
    {{- include "p5-hybrid-llm-gateway.labels" . | nindent 4 }}
spec:
  selector:
    app: gateway
  ports:
  - port: 80
    targetPort: 8080
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ollama-gemma-pointer
  namespace: {{ include "p5-hybrid-llm-gateway.namespace" . }}
  labels:
    {{- include "p5-hybrid-llm-gateway.labels" . | nindent 4 }}
data:
  image: {{ include "p5-hybrid-llm-gateway.registry" . }}/ollama-gemma:7b
{{- end }}
