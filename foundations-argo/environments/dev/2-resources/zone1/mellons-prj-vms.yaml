# Chart: charts/gdc-vm
# Stage: 2-resources (Sync Wave 4: Virtual Machines in zone1)
virtualMachines:
  - name: "mellons-frontend-vm"
    namespace: "mellons-prj"
    imageName: "ubuntu-24.04-v20260601-gdch"
    imageNamespace: "vm-system"
    bootDiskSize: "20Gi"
    machineType: "n3-standard-2-gdc"
    ssh:
      uiAccessEnabled: true
      createProjectNetworkPolicy: true
      externalAccess:
        enabled: false
