# Chart: charts/gdc-clusters
# Stage: 3-clusters (Sync Wave 5: Standard and User Kubernetes Clusters in zone1)
clusters:
  - name: "mellons-cluster"
    namespace: "platform"
    clusterNetwork:
      podCIDRSize: 21
      serviceCIDRSize: 23
    initialVersion:
      kubernetesVersion: "1.35.3-gke.400"
    loadBalancer:
      ingressServiceIPSize: 21
    nodePools:
      - name: "worker-node-pool"
        machineTypeName: "n3-standard-4-gdc"
        nodeCount: 3
    projectBindings:
      - "mellons-prj"
  - name: "mellons-user-cluster"
    namespace: "mellons-prj"
    clusterNetwork:
      podCIDRSize: 21
      serviceCIDRSize: 23
    initialVersion:
      kubernetesVersion: "1.35.3-gke.400"
    loadBalancer:
      ingressServiceIPSize: 21
    nodePools:
      - name: "worker-node-pool"
        machineTypeName: "n3-standard-4-gdc"
        nodeCount: 3
    projectBindings: []
