# Chart: charts/gdc-iam-role-bindings
# Stage: 1-project-factory (Tenant/User IAM RoleBindings for apples-prj)
# Note: Baseline `iac001-sa` project IAM RoleBindings are generated automatically by `1-projects.yaml`.
namespace: "apples-prj"

iamrolebindings:
  - role: "project-iam-admin"
    subject_kind: "User"
    subject_name: "fop-iac@example.com"
  - role: "namespace-admin"
    subject_kind: "User"
    subject_name: "fop-iac@example.com"
  - role: "project-bucket-admin"
    subject_kind: "User"
    subject_name: "fop-iac@example.com"
  - role: "project-bucket-object-admin"
    subject_kind: "User"
    subject_name: "fop-iac@example.com"
  - role: "project-networkpolicy-admin"
    subject_kind: "User"
    subject_name: "fop-iac@example.com"
  - role: "workload-viewer"
    subject_kind: "User"
    subject_name: "fop-iac@example.com"
