# Chart: charts/gdc-notebooks
# Stage: 4-notebooks (Sync Wave 6: Workbench Jupyter Notebooks in zone1)
namespace: "mellons-prj"

notebooks:
  - name: "mellons-notebook"
    namespace: "mellons-prj"
    project: "mellons-prj"
    nb_jupyter_image: "gcr.io/private-cloud-staging/notebooks/deeplearning-platform-release/pytorch-gpu:m125_ext"
    user_cluster_name: "mellons-cluster"
    cpu_limit: "2"
    memory_limit: "4Gi"
    gpu_limit: "1"
    serviceAccountName: "mellons-frontend-sa"
    env:
      - name: "MODEL_PATH"
        value: "/mnt/models"
    nodeSelector:
      cloud.google.com/gke-accelerator: "nvidia-tesla-t4"
    tolerations:
      - key: "nvidia.com/gpu"
        operator: "Exists"
        effect: "NoSchedule"
    volumes:
      - name: "model-storage"
        emptyDir: {}
    volumeMounts:
      - name: "model-storage"
        mountPath: "/mnt/models"
