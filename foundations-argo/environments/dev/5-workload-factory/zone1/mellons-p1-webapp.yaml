# Chart: blueprints/patterns/p1-resilient-3-tier-webapp/chart
# Stage: 5-workload-factory (Sync Wave 7: User Cluster Blueprint Workloads in zone1)
global:
  projectId: "mellons-prj"
  namespace: "mellons-prj"
  registry: "harbor.gdc.local/blueprint-images"
  commonLabels:
    tenant: "tenant-1"
    project: "mellons-prj"
    pattern: "p1-resilient-3-tier-webapp"

# Stage 2 (2-resources) provisions Zonal databases/VMs via core charts/gdc-dbs & charts/gdc-vm
gdc:
  enabled: false
  failover:
    enabled: false

apps:
  enabled: true
