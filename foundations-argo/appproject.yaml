apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: gdc-foundations
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: GDC Air-Gapped Foundations Multi-Stage Landing Zone Project
  # Allow pulling Helm charts and values from internal Git (Gitea/GitLab) and Harbor OCI registries
  sourceRepos:
    - '*'
  # Allow deploying to registered Global, Zonal Management, and User Cluster endpoints
  destinations:
    - name: gdc-global
      namespace: '*'
    - name: gdc-global-projects
      namespace: '*'
    - name: gdc-zone1
      namespace: '*'
    - name: gdc-zone1-projects
      namespace: '*'
    - name: gdc-user-shared
      namespace: '*'
    - server: '*'
      namespace: '*'
  # Allow all GDC Global, Zonal, and Kubernetes cluster-scoped resources
  clusterResourceWhitelist:
    - group: '*'
      kind: '*'
  # Allow all namespace-scoped GDC CRDs and standard Kubernetes resources
  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'
