# Stage 1: 0-org-setup (Sync Wave 1)
# Configures tenant organization-level IAM RoleBindings, Org Policies, and Billing on the Global API.
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .Values.environment }}-0-org-setup-tenant-1-iam
  namespace: {{ .Values.argocdNamespace }}
  labels:
    environment: {{ .Values.environment }}
    stage: 0-org-setup
    tenant: tenant-1
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: {{ .Values.project }}
  sources:
    - repoURL: {{ .Values.git.repoURL }}
      targetRevision: {{ .Values.git.targetRevision }}
      ref: values
    {{- if .Values.oci.enabled }}
    - repoURL: {{ .Values.oci.repoURL }}
      chart: gdc-iam-role-bindings
      targetRevision: {{ .Values.oci.versions.gdcIamRoleBindings | quote }}
    {{- else }}
    - repoURL: {{ .Values.git.repoURL }}
      targetRevision: {{ .Values.git.targetRevision }}
      path: charts/gdc-iam-role-bindings
    {{- end }}
      helm:
        valueFiles:
          - $values/foundations-argo/environments/{{ .Values.environment }}/0-org-setup/tenant-1-iam.yaml
  destination:
    name: {{ .Values.clusters.global }}
    namespace: platform
  syncPolicy:
    {{- toYaml .Values.syncPolicy | nindent 4 }}
