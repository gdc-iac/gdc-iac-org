# Stage 4: 3-clusters (Sync Wave 5)
# Provisions Standard and User Kubernetes clusters and ProjectBindings on Zonal Management APIs.
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .Values.environment }}-3-clusters-zone1-tenant-1
  namespace: {{ .Values.argocdNamespace }}
  labels:
    environment: {{ .Values.environment }}
    stage: 3-clusters
    zone: zone1
    tenant: tenant-1
  annotations:
    argocd.argoproj.io/sync-wave: "5"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: {{ .Values.project }}
  sources:
    - repoURL: {{ .Values.git.repoURL }}
      targetRevision: {{ .Values.git.targetRevision }}
      ref: values
    {{- if .Values.oci.enabled }}
    - repoURL: {{ .Values.oci.repoURL }}
      chart: gdc-clusters
      targetRevision: {{ .Values.oci.versions.gdcClusters | quote }}
    {{- else }}
    - repoURL: {{ .Values.git.repoURL }}
      targetRevision: {{ .Values.git.targetRevision }}
      path: charts/gdc-clusters
    {{- end }}
      helm:
        valueFiles:
          - $values/foundations-argo/environments/{{ .Values.environment }}/3-clusters/zone1/tenant-1-clusters.yaml
  destination:
    name: {{ .Values.clusters.zone1 }}
    namespace: platform
  syncPolicy:
    {{- toYaml .Values.syncPolicy | nindent 4 }}
