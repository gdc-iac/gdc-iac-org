# Shared App #3: 3-clusters-<zone> (Sync Wave 3)
# Provisions Shared User Clusters, Standard Clusters, and ProjectBindings on Zonal Management APIs
# ahead of project Zonal workloads/Notebooks that reference cluster names.
{{- if .Values.stages.clusters.enabled }}
{{- range $zone, $files := .Values.sharedClusters }}
{{- if $files }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ $.Values.environment }}-3-clusters-{{ $zone }}
  namespace: {{ $.Values.argocdNamespace }}
  labels:
    environment: {{ $.Values.environment }}
    stage: 3-clusters
    zone: {{ $zone }}
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: {{ $.Values.project }}
  sources:
    - repoURL: {{ $.Values.git.repoURL }}
      targetRevision: {{ $.Values.git.targetRevision }}
      ref: values
    {{- range $idx, $file := $files }}
    {{- if $.Values.oci.enabled }}
    - repoURL: {{ $.Values.oci.repoURL }}
      chart: gdc-clusters
      targetRevision: {{ $.Values.oci.versions.gdcClusters | quote }}
    {{- else }}
    - repoURL: {{ $.Values.chartsGit.repoURL }}
      targetRevision: {{ $.Values.chartsGit.targetRevision }}
      path: charts/gdc-clusters
    {{- end }}
      helm:
        releaseName: clusters-{{ $zone }}-{{ $idx }}
        valueFiles:
          - $values/{{ $file }}
    {{- end }}
  destination:
    name: {{ index $.Values.clusters.zones $zone }}
    namespace: platform
  syncPolicy:
    {{- toYaml $.Values.syncPolicy | nindent 4 }}
{{- end }}
{{- end }}
{{- end }}
