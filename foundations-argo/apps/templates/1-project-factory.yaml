# Stage 2: 1-project-factory (Sync Waves 2 & 3)
# Wave 2 creates GDC Projects on the Global API; Wave 3 provisions Project IAM, Service Accounts, and Network Policies.
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .Values.environment }}-1-project-factory-mellons-prj
  namespace: {{ .Values.argocdNamespace }}
  labels:
    environment: {{ .Values.environment }}
    stage: 1-project-factory
    tenant: tenant-1
    project: mellons-prj
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: {{ .Values.project }}
  sources:
    - repoURL: {{ .Values.git.repoURL }}
      targetRevision: {{ .Values.git.targetRevision }}
      ref: values
    {{- if .Values.oci.enabled }}
    - repoURL: {{ .Values.oci.repoURL }}
      chart: gdc-projects
      targetRevision: {{ .Values.oci.versions.gdcProjects | quote }}
    {{- else }}
    - repoURL: {{ .Values.git.repoURL }}
      targetRevision: {{ .Values.git.targetRevision }}
      path: charts/gdc-projects
    {{- end }}
      helm:
        valueFiles:
          - $values/foundations-argo/environments/{{ .Values.environment }}/1-project-factory/mellons-prj-project.yaml
  destination:
    name: {{ .Values.clusters.global }}
    namespace: platform
  syncPolicy:
    {{- toYaml .Values.syncPolicy | nindent 4 }}
