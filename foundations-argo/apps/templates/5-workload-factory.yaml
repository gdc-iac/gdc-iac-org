# Optional Stage: 5-workload-factory (Sync Wave 5)
# Deploys Blueprint Workload Patterns onto User Shared or Standard Clusters per project.
{{- if .Values.stages.workloadFactory.enabled }}
{{- range $proj := .Values.projects }}
{{- range $zone, $wlist := (default dict $proj.workloads) }}
{{- range $w := $wlist }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ $.Values.environment }}-5-workload-factory-{{ $zone }}-{{ $w.name }}
  namespace: {{ $.Values.argocdNamespace }}
  labels:
    environment: {{ $.Values.environment }}
    stage: 5-workload-factory
    zone: {{ $zone }}
    {{- if $proj.tenant }}
    tenant: {{ $proj.tenant }}
    {{- end }}
    project: {{ $proj.name }}
    pattern: {{ default "p1-resilient-3-tier-webapp" $w.pattern }}
  annotations:
    argocd.argoproj.io/sync-wave: "5"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: {{ $.Values.project }}
  sources:
    - repoURL: {{ $.Values.git.repoURL }}
      targetRevision: {{ $.Values.git.targetRevision }}
      ref: values
    {{- if $.Values.oci.enabled }}
    - repoURL: {{ $.Values.oci.repoURL }}
      chart: {{ default "p1-resilient-3-tier-webapp" $w.chart }}
      targetRevision: {{ $.Values.oci.versions.p1Resilient3TierWebapp | quote }}
    {{- else }}
    - repoURL: {{ $.Values.chartsGit.repoURL }}
      targetRevision: {{ $.Values.chartsGit.targetRevision }}
      path: {{ default "blueprints/patterns/p1-resilient-3-tier-webapp/chart" $w.path }}
    {{- end }}
      helm:
        releaseName: {{ $w.name }}
        valueFiles:
          - $values/{{ $w.valuesFile }}
  destination:
    name: {{ default $.Values.clusters.userShared $w.cluster }}
    namespace: {{ default $proj.name $w.namespace }}
  syncPolicy:
    {{- toYaml $.Values.syncPolicy | nindent 4 }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
