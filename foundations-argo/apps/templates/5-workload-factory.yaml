# Stage 6: 5-workload-factory (Sync Wave 7)
# Deploys Blueprint Workload Patterns onto User Shared or Standard Clusters.
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .Values.environment }}-5-workload-factory-zone1-mellons-p1-webapp
  namespace: {{ .Values.argocdNamespace }}
  labels:
    environment: {{ .Values.environment }}
    stage: 5-workload-factory
    zone: zone1
    tenant: tenant-1
    project: mellons-prj
    pattern: p1-resilient-3-tier-webapp
  annotations:
    argocd.argoproj.io/sync-wave: "7"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: {{ .Values.project }}
  sources:
    - repoURL: {{ .Values.git.repoURL }}
      targetRevision: {{ .Values.git.targetRevision }}
      ref: values
    - repoURL: {{ .Values.git.repoURL }}
      targetRevision: {{ .Values.git.targetRevision }}
      path: blueprints/patterns/p1-resilient-3-tier-webapp/chart
      helm:
        valueFiles:
          - $values/foundations-argo/environments/{{ .Values.environment }}/5-workload-factory/zone1/mellons-p1-webapp.yaml
  destination:
    name: {{ .Values.clusters.userShared }}
    namespace: mellons-prj
  syncPolicy:
    {{- toYaml .Values.syncPolicy | nindent 4 }}
