# Shared App #1: 0-foundation-global (Sync Wave 0)
# Consolidates organization-level and iac-root IAM RoleBindings (0-bootstrap + 0-org-setup)
# into a single Multi-Source Application on the Global API (`gdc-global`).
{{- if .Values.stages.foundationGlobal.enabled }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .Values.environment }}-0-foundation-global
  namespace: {{ .Values.argocdNamespace }}
  labels:
    environment: {{ .Values.environment }}
    stage: 0-foundation-global
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: {{ .Values.project }}
  sources:
    - repoURL: {{ .Values.git.repoURL }}
      targetRevision: {{ .Values.git.targetRevision }}
      ref: values
    {{- range $idx, $file := .Values.foundationGlobal.bootstrapFiles }}
    {{- if $.Values.oci.enabled }}
    - repoURL: {{ $.Values.oci.repoURL }}
      chart: gdc-iam-role-bindings
      targetRevision: {{ $.Values.oci.versions.gdcIamRoleBindings | quote }}
    {{- else }}
    - repoURL: {{ $.Values.chartsGit.repoURL }}
      targetRevision: {{ $.Values.chartsGit.targetRevision }}
      path: charts/gdc-iam-role-bindings
    {{- end }}
      helm:
        releaseName: bootstrap-iam-{{ $idx }}
        valueFiles:
          - $values/{{ $file }}
    {{- end }}
    {{- range $idx, $file := .Values.foundationGlobal.orgIamFiles }}
    {{- if $.Values.oci.enabled }}
    - repoURL: {{ $.Values.oci.repoURL }}
      chart: gdc-iam-role-bindings
      targetRevision: {{ $.Values.oci.versions.gdcIamRoleBindings | quote }}
    {{- else }}
    - repoURL: {{ $.Values.chartsGit.repoURL }}
      targetRevision: {{ $.Values.chartsGit.targetRevision }}
      path: charts/gdc-iam-role-bindings
    {{- end }}
      helm:
        releaseName: org-iam-{{ $idx }}
        valueFiles:
          - $values/{{ $file }}
    {{- end }}
  destination:
    name: {{ .Values.clusters.global }}
    namespace: platform
  syncPolicy:
    {{- toYaml .Values.syncPolicy | nindent 4 }}
{{- end }}
