# Centralized configuration for all GDC Foundations Argo CD Applications
environment: dev
argocdNamespace: argocd
project: gdc-foundations

# Source Git repository containing environment values (and charts when oci.enabled is false)
git:
  repoURL: http://gitea.gitea.svc:80/org-12345/gdc-iac-org.git
  targetRevision: main

# Optional: Pull packaged Helm charts from Managed Harbor OCI registry instead of Git paths
oci:
  enabled: false
  repoURL: harbor001-iac-root.org-12345.zone1-a.gdch.test/iac/charts
  versions:
    gdcIamRoleBindings: 0.1.3
    gdcProjects: 0.1.2
    gdcProjectServiceAccounts: 0.1.2
    gdcProjectNetworkPolicies: 0.1.2
    gdcHarbors: 0.1.2
    gdcBuckets: 0.1.2
    gdcVm: 0.1.4
    gdcClusters: 0.1.5
    gdcNotebooks: 0.1.2

# Registered Argo CD target cluster names (matching Secret stringData.name)
clusters:
  global: gdc-global
  zone1: gdc-zone1
  zone2: gdc-zone2
  userShared: gdc-user-shared

# Default SyncPolicy applied to generated Applications
syncPolicy:
  automated:
    prune: true
    selfHeal: true
  syncOptions:
    - CreateNamespace=false
    - ServerSideApply=true
