# Alternative single-resource ApplicationSet matching Option 3 (3 Shared Apps + 2 Per-Project Apps)
# across Global, Zonal, and User Cluster endpoints with ordered sync waves.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: gdc-foundations-dev
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - list:
        elements:
          # Shared App #1: 0-foundation-global (Wave 0 -> gdc-global)
          - name: 0-foundation-global
            stage: 0-foundation-global
            wave: "0"
            cluster: gdc-global
            namespace: platform
            charts:
              - chart: gdc-iam-role-bindings
                chartVersion: "0.1.3"
                releaseName: bootstrap-iam-0
                valuesFile: environments/dev/0-bootstrap/iac-iam-global.yaml
              - chart: gdc-iam-role-bindings
                chartVersion: "0.1.3"
                releaseName: bootstrap-iam-1
                valuesFile: environments/dev/0-bootstrap/iac-iam-project.yaml
              - chart: gdc-iam-role-bindings
                chartVersion: "0.1.3"
                releaseName: org-iam-0
                valuesFile: environments/dev/0-org-setup/tenant-1-iam.yaml

          # Shared App #2: 1-projects (Wave 1 -> gdc-global)
          - name: 1-projects
            stage: 1-project-factory
            wave: "1"
            cluster: gdc-global
            namespace: platform
            inlineCharts:
              - chart: gdc-projects
                chartVersion: "0.1.1"
                releaseName: gdc-projects
                values: |
                  projects:
                    mellons-prj:
                      name: "mellons-prj"
                      namespace: "platform"
                    apples-prj:
                      name: "apples-prj"
                      namespace: "platform"
              - chart: gdc-iam-role-bindings
                chartVersion: "0.1.3"
                releaseName: mellons-prj-iac-iam
                values: |
                  namespace: "mellons-prj"
                  iamrolebindings:
                    - {role: "project-iam-admin", subject_kind: "ServiceAccount", subject_name: "iac001-sa", subject_namespace: "iac-root"}
                    - {role: "secret-admin", subject_kind: "ServiceAccount", subject_name: "iac001-sa", subject_namespace: "iac-root"}
                    - {role: "namespace-admin", subject_kind: "ServiceAccount", subject_name: "iac001-sa", subject_namespace: "iac-root"}
                    - {role: "project-bucket-admin", subject_kind: "ServiceAccount", subject_name: "iac001-sa", subject_namespace: "iac-root"}
                    - {role: "project-bucket-object-admin", subject_kind: "ServiceAccount", subject_name: "iac001-sa", subject_namespace: "iac-root"}
                    - {role: "project-vm-admin", subject_kind: "ServiceAccount", subject_name: "iac001-sa", subject_namespace: "iac-root"}
                    - {role: "project-networkpolicy-admin", subject_kind: "ServiceAccount", subject_name: "iac001-sa", subject_namespace: "iac-root"}
                    - {role: "harbor-instance-admin", subject_kind: "ServiceAccount", subject_name: "iac001-sa", subject_namespace: "iac-root"}
                    - {role: "harbor-project-creator", subject_kind: "ServiceAccount", subject_name: "iac001-sa", subject_namespace: "iac-root"}
                    - {role: "workbench-notebooks-admin", subject_kind: "ServiceAccount", subject_name: "iac001-sa", subject_namespace: "iac-root"}
                    - {role: "standard-cluster-admin", subject_kind: "ServiceAccount", subject_name: "iac001-sa", subject_namespace: "iac-root"}
                    - {role: "dashboard-editor", subject_kind: "ServiceAccount", subject_name: "iac001-sa", subject_namespace: "iac-root"}
                    - {role: "workload-viewer", subject_kind: "ServiceAccount", subject_name: "iac001-sa", subject_namespace: "iac-root"}
              - chart: gdc-iam-role-bindings
                chartVersion: "0.1.3"
                releaseName: apples-prj-iac-iam
                values: |
                  namespace: "apples-prj"
                  iamrolebindings:
                    - {role: "project-iam-admin", subject_kind: "ServiceAccount", subject_name: "iac001-sa", subject_namespace: "iac-root"}
                    - {role: "secret-admin", subject_kind: "ServiceAccount", subject_name: "iac001-sa", subject_namespace: "iac-root"}
                    - {role: "namespace-admin", subject_kind: "ServiceAccount", subject_name: "iac001-sa", subject_namespace: "iac-root"}
                    - {role: "project-bucket-admin", subject_kind: "ServiceAccount", subject_name: "iac001-sa", subject_namespace: "iac-root"}
                    - {role: "project-bucket-object-admin", subject_kind: "ServiceAccount", subject_name: "iac001-sa", subject_namespace: "iac-root"}
                    - {role: "project-vm-admin", subject_kind: "ServiceAccount", subject_name: "iac001-sa", subject_namespace: "iac-root"}
                    - {role: "project-networkpolicy-admin", subject_kind: "ServiceAccount", subject_name: "iac001-sa", subject_namespace: "iac-root"}
                    - {role: "harbor-instance-admin", subject_kind: "ServiceAccount", subject_name: "iac001-sa", subject_namespace: "iac-root"}
                    - {role: "harbor-project-creator", subject_kind: "ServiceAccount", subject_name: "iac001-sa", subject_namespace: "iac-root"}
                    - {role: "workbench-notebooks-admin", subject_kind: "ServiceAccount", subject_name: "iac001-sa", subject_namespace: "iac-root"}
                    - {role: "standard-cluster-admin", subject_kind: "ServiceAccount", subject_name: "iac001-sa", subject_namespace: "iac-root"}
                    - {role: "dashboard-editor", subject_kind: "ServiceAccount", subject_name: "iac001-sa", subject_namespace: "iac-root"}
                    - {role: "workload-viewer", subject_kind: "ServiceAccount", subject_name: "iac001-sa", subject_namespace: "iac-root"}

          # Per-Project App #1a: 1-project-mellons-prj (Wave 2 -> gdc-global-projects)
          - name: 1-project-mellons-prj
            stage: 1-project-factory
            wave: "2"
            cluster: gdc-global-projects
            namespace: mellons-prj
            charts:
              - chart: gdc-iam-role-bindings
                chartVersion: "0.1.3"
                releaseName: mellons-prj-iam
                valuesFile: environments/dev/1-project-factory/mellons-prj-iam.yaml
              - chart: gdc-project-service-accounts
                chartVersion: "0.1.1"
                releaseName: mellons-prj-sa
                valuesFile: environments/dev/1-project-factory/mellons-prj-sa.yaml
              - chart: gdc-project-network-policies
                chartVersion: "0.1.2"
                releaseName: mellons-prj-netpols
                valuesFile: environments/dev/1-project-factory/mellons-prj-netpols.yaml

          # Per-Project App #1b: 1-project-apples-prj (Wave 2 -> gdc-global-projects)
          - name: 1-project-apples-prj
            stage: 1-project-factory
            wave: "2"
            cluster: gdc-global-projects
            namespace: apples-prj
            charts:
              - chart: gdc-iam-role-bindings
                chartVersion: "0.1.3"
                releaseName: apples-prj-iam
                valuesFile: environments/dev/1-project-factory/apples-prj-iam.yaml
              - chart: gdc-project-service-accounts
                chartVersion: "0.1.1"
                releaseName: apples-prj-sa
                valuesFile: environments/dev/1-project-factory/apples-prj-sa.yaml
              - chart: gdc-project-network-policies
                chartVersion: "0.1.2"
                releaseName: apples-prj-netpols
                valuesFile: environments/dev/1-project-factory/apples-prj-netpols.yaml

          # Shared App #3: 3-clusters-zone1 (Wave 3 -> gdc-zone1)
          - name: 3-clusters-zone1
            stage: 3-clusters
            wave: "3"
            cluster: gdc-zone1
            namespace: platform
            charts:
              - chart: gdc-clusters
                chartVersion: "0.1.3"
                releaseName: clusters-zone1-0
                valuesFile: environments/dev/3-clusters/zone1/tenant-1-clusters.yaml

          # Per-Project App #2a: 2-resources-zone1-mellons-prj (Wave 4 -> gdc-zone1-projects)
          - name: 2-resources-zone1-mellons-prj
            stage: 2-resources
            wave: "4"
            cluster: gdc-zone1-projects
            namespace: mellons-prj
            charts:
              - chart: gdc-harbors
                chartVersion: "0.1.2"
                releaseName: mellons-prj-harbors
                valuesFile: environments/dev/2-resources/zone1/mellons-prj-harbors.yaml
              - chart: gdc-buckets
                chartVersion: "0.1.2"
                releaseName: mellons-prj-buckets
                valuesFile: environments/dev/2-resources/zone1/mellons-prj-buckets.yaml
              - chart: gdc-vm
                chartVersion: "0.1.5"
                releaseName: mellons-prj-vms
                valuesFile: environments/dev/2-resources/zone1/mellons-prj-vms.yaml
              - chart: gdc-notebooks
                chartVersion: "0.1.2"
                releaseName: mellons-prj-notebooks
                valuesFile: environments/dev/2-resources/zone1/mellons-prj-notebooks.yaml

          # Per-Project App #2b: 2-resources-zone1-apples-prj (Wave 4 -> gdc-zone1-projects)
          - name: 2-resources-zone1-apples-prj
            stage: 2-resources
            wave: "4"
            cluster: gdc-zone1-projects
            namespace: apples-prj
            charts:
              - chart: gdc-buckets
                chartVersion: "0.1.2"
                releaseName: apples-prj-buckets
                valuesFile: environments/dev/2-resources/zone1/apples-prj-buckets.yaml
  template:
    metadata:
      name: 'dev-{{ .name }}'
      namespace: argocd
      labels:
        environment: dev
        stage: '{{ .stage }}'
        targetCluster: '{{ .cluster }}'
      annotations:
        argocd.argoproj.io/sync-wave: '{{ .wave }}'
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: gdc-foundations
      destination:
        name: '{{ .cluster }}'
        namespace: '{{ .namespace }}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        retry:
          limit: 5
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m
        syncOptions:
          - CreateNamespace=false
          - ServerSideApply=true
  templatePatch: |
    spec:
      sources:
        {{- if hasKey . "charts" }}
        - repoURL: ssh://git@gitea.gitea.svc/org-12345/landing-argo.git
          targetRevision: main
          ref: values
        {{- range .charts }}
        - repoURL: harbor001-iac-root.org-12345.zone1.gdc.test/charts
          chart: {{ .chart | quote }}
          targetRevision: {{ .chartVersion | quote }}
          helm:
            releaseName: {{ .releaseName | quote }}
            valueFiles:
              - '$values/{{ .valuesFile }}'
        {{- end }}
        {{- end }}
        {{- if hasKey . "inlineCharts" }}
        {{- range .inlineCharts }}
        - repoURL: harbor001-iac-root.org-12345.zone1.gdc.test/charts
          chart: {{ .chart | quote }}
          targetRevision: {{ .chartVersion | quote }}
          helm:
            releaseName: {{ .releaseName | quote }}
            values: |
              {{- .values | nindent 14 }}
        {{- end }}
        {{- end }}
