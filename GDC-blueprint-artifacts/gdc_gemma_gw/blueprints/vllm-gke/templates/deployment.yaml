apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "vllm.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "vllm.name" . }}
spec:
  strategy:
    type: Recreate
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "vllm.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "vllm.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      containers:
        - name: vllm
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - "--model"
            - "{{ .Values.model.name }}"
            - "--max-model-len"
            - "{{ .Values.model.maxModelLen }}"
            - "--gpu-memory-utilization"
            - "{{ .Values.model.gpuMemoryUtilization }}"
            - "--max-num-batched-tokens"
            - "4096"
            {{- if .Values.model.quantization }}
            - "--quantization"
            - "{{ .Values.model.quantization }}"
            {{- end }}
            {{- if .Values.model.servedModelName }}
            - "--served-model-name"
            - "{{ .Values.model.servedModelName }}"
            {{- end }}
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token-secret
                  key: token
                  optional: true
            {{- if .Values.persistence.enabled }}
            - name: HF_HOME
              value: "/models/hf-cache"
            {{- end }}
          {{- if .Values.persistence.enabled }}
          volumeMounts:
            - name: model-weights
              mountPath: /models
          {{- end }}
          resources:
            limits:
              nvidia.com/gpu: {{ .Values.resources.limits.gpu | default 1 }}
              memory: {{ .Values.resources.limits.memory }}
            requests:
              cpu: {{ .Values.resources.requests.cpu }}
              memory: {{ .Values.resources.requests.memory }}
      {{- if .Values.persistence.enabled }}
      volumes:
        - name: model-weights
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim | default (printf "%s-weights" (include "vllm.fullname" .)) }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
