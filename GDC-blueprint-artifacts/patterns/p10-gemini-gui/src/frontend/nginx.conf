server {
    listen 80;
    server_name localhost;
    client_max_body_size 50M;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        # Proxy to the backend service
        # In Kubernetes, the service name is 'backend' (or 'backend-svc')
        # We assume 'backend-svc' based on manifest, or 'backend' if in same namespace/docker-compose
        # Let's check backend.yaml. It says service name is 'backend-svc'.
        # However, Nginx resolves DNS.
        proxy_pass http://backend-svc:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
