global:
  domain: "theia.gdc.local"
  gdcAirgapped: true

# Ingress: NGINX disabled in favor of Kubernetes Gateway API
ingress:
  enabled: false

gatewayApi:
  enabled: true
  gatewayClassName: "gdc-theia-gateway-class"
  gatewayName: "theia-cloud-gateway"

# Phase 1 TLS: Self-signed certificate enabled for initial deployment testing
tls:
  enabled: true
  issuerCa:
    create: true
    secretName: "theia-selfsigned-cert-secret"

# Phase 1 Identity: Mock authentication mode enabled
authentication:
  type: "mock"
  mockHeaderUser: "X-User-ID"
  keycloak:
    enabled: false # Deferred to Phase 2

# Workspace session operator parameters
operator:
  replicaCount: 1
  image:
    repository: "us-central1-docker.pkg.dev/test-project/blueprint-images/theia-cloud-operator"
    tag: "latest"
  resources:
    limits:
      cpu: "500m"
      memory: "512Mi"
    requests:
      cpu: "100m"
      memory: "128Mi"

landingPage:
  replicaCount: 1
  image:
    repository: "us-central1-docker.pkg.dev/test-project/blueprint-images/theia-cloud-landing-page"
    tag: "latest"
  resources:
    limits:
      cpu: "200m"
      memory: "256Mi"
    requests:
      cpu: "50m"
      memory: "64Mi"
