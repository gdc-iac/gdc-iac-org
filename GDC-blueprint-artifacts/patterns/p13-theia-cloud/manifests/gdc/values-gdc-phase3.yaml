global:
  domain: "theia.gdc.local"
  gdcAirgapped: true

ingress:
  enabled: false

gatewayApi:
  enabled: true
  gatewayClassName: "gdc-theia-gateway-class"
  gatewayName: "theia-cloud-gateway"

# Phase 3 PKI Migration: Disable self-signed CA in favor of GDC Platform ClusterIssuer
tls:
  enabled: true
  issuerCa:
    create: false # Upstream self-signed CA disabled
  certManager:
    enabled: true
    clusterIssuer: "gdc-ca-issuer"
    secretName: "theia-cloud-tls-secret"

# Phase 3 Persistent Storage: Enable GDC PersistentVolumeClaims for developer sessions
storage:
  pvc:
    enabled: true
    storageClassName: "standard-rwo"
    size: "20Gi"
    mountPath: "/workspace"

authentication:
  type: "oidc"
  mockHeaderUser: "X-Forwarded-User"
  keycloak:
    enabled: true
    realm: "gdc-theia-realm"
    clientId: "theia-cloud-client"
    authority: "https://keycloak.gdc.local/realms/gdc-theia-realm"

operator:
  replicaCount: 2 # Phase 3 HA multi-tenant session reconciliation
  image:
    repository: "us-central1-docker.pkg.dev/test-project/blueprint-images/theia-cloud-operator"
    tag: "latest"
  resources:
    limits:
      cpu: "1000m"
      memory: "1024Mi"
    requests:
      cpu: "200m"
      memory: "256Mi"

landingPage:
  replicaCount: 2
  image:
    repository: "us-central1-docker.pkg.dev/test-project/blueprint-images/theia-cloud-landing-page"
    tag: "latest"
  resources:
    limits:
      cpu: "500m"
      memory: "512Mi"
    requests:
      cpu: "100m"
      memory: "128Mi"
