apiVersion: v1
kind: ConfigMap
metadata:
  name: theia-oidc-auth-config
  namespace: theia-cloud
  labels:
    app.kubernetes.io/name: theia-cloud
data:
  AUTH_MODE: "oidc"
  HEADER_USER_KEY: "X-Forwarded-User"
  OIDC_AUTHORITY: "https://keycloak.gdc.local/realms/gdc-theia-realm"
  OIDC_CLIENT_ID: "theia-cloud-client"
  OIDC_REDIRECT_URI: "https://theia.gdc.local/auth/callback"
