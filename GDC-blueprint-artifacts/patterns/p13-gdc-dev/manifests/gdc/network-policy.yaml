apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gdc-dev-netpol
  namespace: gdc-dev
  labels:
    app.kubernetes.io/name: gdc-dev
    app.kubernetes.io/component: phase3-hardening
spec:
  podSelector:
    matchExpressions:
    - key: app
      operator: In
      values: ["gdc-dev-landing-page", "gdc-dev-operator"]
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # Allow traffic from Gateway API ingress controllers and internal cluster monitoring
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: gdc-gateway-system
    - podSelector:
        matchLabels:
          app: gdc-dev-operator
    ports:
    - protocol: TCP
      port: 8080
    - protocol: TCP
      port: 3000
  egress:
  # Allow DNS resolution within cluster
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  # Allow OIDC authentication traffic to Keycloak (`p12-keycloak`)
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: my-gdc-project # or target keycloak namespace
    ports:
    - protocol: TCP
      port: 80
    - protocol: TCP
      port: 443
    - protocol: TCP
      port: 8080
  # Allow internal session proxying from landing page to operator
  - to:
    - podSelector:
        matchLabels:
          app: gdc-dev-operator
    ports:
    - protocol: TCP
      port: 3000
