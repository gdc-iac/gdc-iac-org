# Common settings
namespace: my-db-project # Target GDC project namespace on the Zone Management API server

# Optional fallback Base64-encoded administrator password (`dbsadmin`).
# Generate with: echo -n 'YourSecurePassword' | base64 -w0
# IMPORTANT: Provide via SOPS-encrypted secrets or `--set` at install time; never commit plaintext credentials.
base64EncodedPassword: ""

# PostgreSQL settings (`postgresql.dbadmin.gdc.goog/v1` DBCluster on AlloyDB Omni runtime)
postgresql:
  enabled: false
  clusterName: my-pg-cluster
  createSecret: true
  base64EncodedPassword: "" # Overrides top-level base64EncodedPassword when set
  # secretName: ""          # Defaults to db-pw-<clusterName> (required by GDCag vdbcluster webhook)
  version: "15"
  cpu: 2
  memory: 8Gi
  dataDiskSize: 50Gi
  availability:
    enableHighAvailability: true
    enableAutoFailover: true
  parameters: {}            # Optional key-value PostgreSQL engine parameters (spec.primarySpec.parameters)
  backupPlan:
    enabled: false
    name: ""                # Defaults to <clusterName>-backup-plan
    backupRepository: ""    # Optional BackupRepository name for fleet.dbadmin.goog/backup-repository annotation
    backupRetainDays: 14
    paused: false
    PITREnabled: false

# Optional list of additional PostgreSQL DBClusters to provision in the same project release
# (for example, deploying both `gitlab-db` and `vault-db` via Stage 2 `2-resources`).
# Each item supports the same fields as `postgresql` above.
postgresqlClusters: []

# DEPRECATED: Oracle DB (`oracle.dbadmin.gdc.goog/v1` DBCluster) is deprecated on GDCag.
# Retained only for backward compatibility; use `postgresql` (`postgresql.dbadmin.gdc.goog/v1`) for all new deployments.
oracle:
  enabled: false
  clusterName: my-ora-cluster
  createSecret: true
  base64EncodedPassword: "" # Overrides top-level base64EncodedPassword when set
  # secretName: ""          # Defaults to db-pw-<clusterName>
  version: "19"
  cpu: 2
  memory: 8Gi
  dataDiskSize: 20Gi
  logDiskSize: 20Gi
  cdbName: MYORACDB
