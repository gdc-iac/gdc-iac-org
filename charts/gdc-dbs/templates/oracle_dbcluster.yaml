{{/*
DEPRECATED: Oracle DB (oracle.dbadmin.gdc.goog/v1) is deprecated on GDC air-gapped (GDCag).
This template is retained solely for backward compatibility; use PostgreSQL 15 (postgresql.dbadmin.gdc.goog/v1) for new deployments.
*/}}
{{- $ora := .Values.oracle | default dict -}}
{{- if $ora.enabled }}
{{- $oraName := required "oracle.clusterName is required" $ora.clusterName }}
---
# DEPRECATED: Oracle DB (oracle.dbadmin.gdc.goog/v1) is deprecated on GDCag.
apiVersion: oracle.dbadmin.gdc.goog/v1
kind: DBCluster
metadata:
  name: {{ $oraName }}
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: {{ include "gdc-dbs.name" . }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
spec:
  primarySpec:
    version: {{ ($ora.version | default "19") | quote }}
    adminUser:
      passwordRef:
        name: {{ $ora.secretName | default (printf "db-pw-%s" $oraName) }}
    resources:
      cpu: {{ $ora.cpu | default 2 }}
      memory: {{ $ora.memory | default "8Gi" }}
      disks:
        - name: DataDisk
          size: {{ $ora.dataDiskSize | default "20Gi" }}
        - name: LogDisk
          size: {{ $ora.logDiskSize | default "20Gi" }}
    cdbName: {{ $ora.cdbName }}
{{- end }}
