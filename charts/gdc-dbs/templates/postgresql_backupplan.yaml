{{- $pgClusters := list -}}
{{- $pg := .Values.postgresql | default dict -}}
{{- if $pg.enabled -}}
  {{- $pgClusters = append $pgClusters $pg -}}
{{- end -}}
{{- range $cluster := (.Values.postgresqlClusters | default list) -}}
  {{- $cEnabled := true -}}
  {{- if hasKey $cluster "enabled" -}}
    {{- $cEnabled = $cluster.enabled -}}
  {{- end -}}
  {{- if $cEnabled -}}
    {{- $pgClusters = append $pgClusters $cluster -}}
  {{- end -}}
{{- end -}}

{{- range $item := $pgClusters }}
{{- $bp := $item.backupPlan | default dict -}}
{{- if $bp.enabled }}
{{- $clusterName := required "postgresql.clusterName is required" $item.clusterName -}}
{{- $paused := false -}}
{{- if hasKey $bp "paused" -}}
  {{- $paused = $bp.paused -}}
{{- end -}}
{{- $pitr := false -}}
{{- if hasKey $bp "PITREnabled" -}}
  {{- $pitr = $bp.PITREnabled -}}
{{- end }}
---
apiVersion: postgresql.dbadmin.gdc.goog/v1
kind: BackupPlan
metadata:
  name: {{ $bp.name | default (printf "%s-backup-plan" $clusterName) }}
  namespace: {{ $.Values.namespace }}
  labels:
    app.kubernetes.io/name: {{ include "gdc-dbs.name" $ }}
    helm.sh/chart: {{ $.Chart.Name }}-{{ $.Chart.Version | replace "+" "_" }}
spec:
  dbclusterRef: {{ $clusterName }}
  backupRetainDays: {{ $bp.backupRetainDays | default 14 }}
  paused: {{ $paused }}
  PITREnabled: {{ $pitr }}
{{- end }}
{{- end }}
