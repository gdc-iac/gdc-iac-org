{{- $pgSecretClusters := list -}}
{{- $pg := .Values.postgresql | default dict -}}
{{- if $pg.enabled -}}
  {{- $createPgSecret := true -}}
  {{- if hasKey $pg "createSecret" -}}
    {{- $createPgSecret = $pg.createSecret -}}
  {{- end -}}
  {{- if $createPgSecret -}}
    {{- $pgSecretClusters = append $pgSecretClusters $pg -}}
  {{- end -}}
{{- end -}}
{{- range $cluster := (.Values.postgresqlClusters | default list) -}}
  {{- $cEnabled := true -}}
  {{- if hasKey $cluster "enabled" -}}
    {{- $cEnabled = $cluster.enabled -}}
  {{- end -}}
  {{- $cCreate := true -}}
  {{- if hasKey $cluster "createSecret" -}}
    {{- $cCreate = $cluster.createSecret -}}
  {{- end -}}
  {{- if and $cEnabled $cCreate -}}
    {{- $pgSecretClusters = append $pgSecretClusters $cluster -}}
  {{- end -}}
{{- end -}}

{{- range $item := $pgSecretClusters }}
{{- $clusterName := required "postgresql.clusterName is required" $item.clusterName -}}
{{- $secretName := $item.secretName | default (printf "db-pw-%s" $clusterName) -}}
{{- $pgPass := $item.base64EncodedPassword | default $.Values.base64EncodedPassword -}}
{{- if not $pgPass }}
{{- fail (printf "You must provide a value for postgresql.base64EncodedPassword or base64EncodedPassword when creating Secret %s." $secretName) }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ $.Values.namespace }}
  labels:
    app.kubernetes.io/name: {{ include "gdc-dbs.name" $ }}
    helm.sh/chart: {{ $.Chart.Name }}-{{ $.Chart.Version | replace "+" "_" }}
    dbtype: postgresql
type: Opaque
data:
  # GDCag DBCluster controller requires the Secret data key to match the DBCluster name
  {{ $clusterName }}: {{ $pgPass | quote }}
{{- end }}

{{/* DEPRECATED: Oracle DB is deprecated on GDCag; Secret rendering retained for backward compatibility. */}}
{{- $ora := .Values.oracle | default dict -}}
{{- if $ora.enabled }}
{{- $createOraSecret := true -}}
{{- if hasKey $ora "createSecret" -}}
  {{- $createOraSecret = $ora.createSecret -}}
{{- end -}}
{{- if $createOraSecret }}
{{- $oraName := required "oracle.clusterName is required" $ora.clusterName -}}
{{- $oraSecretName := $ora.secretName | default (printf "db-pw-%s" $oraName) -}}
{{- $oraPass := $ora.base64EncodedPassword | default $.Values.base64EncodedPassword -}}
{{- if not $oraPass }}
{{- fail (printf "You must provide a value for oracle.base64EncodedPassword or base64EncodedPassword when creating Secret %s." $oraSecretName) }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $oraSecretName }}
  namespace: {{ $.Values.namespace }}
  labels:
    app.kubernetes.io/name: {{ include "gdc-dbs.name" $ }}
    helm.sh/chart: {{ $.Chart.Name }}-{{ $.Chart.Version | replace "+" "_" }}
    dbtype: oracle
type: Opaque
data:
  # GDCag DBCluster controller requires the Secret data key to match the DBCluster name
  {{ $oraName }}: {{ $oraPass | quote }}
{{- end }}
{{- end }}
