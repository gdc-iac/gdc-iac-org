# Default values for gdc-cross-project-network-policies.

# The project/namespace where policies will be applied
project: ""

# Cross-project network policies configuration
# See: https://cloud.google.com/distributed-cloud/hosted/docs/latest/gdch/platform/pa-user/pnp/cross-project-traffic
crossProjectPolicies: []
  # Example Cross-Project Ingress Policy:
  # Allows PROJECT_2 to connect to PROJECT_1 (where this chart is deployed)
  # - name: allow-inbound-from-project-2
  #   policyType: Ingress
  #   subject:
  #     subjectType: UserWorkload
  #   ingress:
  #     - from:
  #       - projectSelector:
  #           projects:
  #             matchNames:
  #             - "project-2"

  # Example Cross-Project Egress Policy:
  # Allows PROJECT_1 (where this chart is deployed) to connect to PROJECT_2
  # - name: allow-outbound-to-project-2
  #   policyType: Egress
  #   subject:
  #     subjectType: UserWorkload
  #   egress:
  #     - to:
  #       - projectSelector:
  #           projects:
  #             matchNames:
  #             - "project-2"

  # Example Workload-specific Cross-Project Ingress Policy:
  # Allows only 'frontend' in PROJECT_2 to connect to 'backend' in PROJECT_1
  # - name: allow-p2-frontend-to-p1-backend
  #   policyType: Ingress
  #   subject:
  #     subjectType: UserWorkload
  #     matchLabels:
  #       app: backend
  #   ingress:
  #     - from:
  #       - projectSelector:
  #           projects:
  #             matchNames:
  #             - "project-2"
  #           matchLabels:
  #             app: frontend
