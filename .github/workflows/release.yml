## Reference: https://github.com/helm/chart-releaser-action
name: Release Automation
on:
  push:
    branches:
      - main
    paths:
      - "charts/**"
      - "foundations/**"
      - "blueprints/**"
      - "VERSION"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    if: github.repository == 'gdc-iac/gdc-iac-org'
    permissions:
      contents: write  # for chart-releaser and releases
      packages: write  # for pushing OCI charts to ghcr.io
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@f808768d1510423e83855289c910610ca9b43176 # v2.17.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2 # v5.0.0
        with:
          version: v3.18.0

      - name: Configure Git
        run: |
          git config --global user.name "$GITHUB_ACTOR"
          git config --global user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@cae68fefc6b5f367a0275617c9f83181ba54714f # v1.7.0
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          CR_SKIP_EXISTING: true

      - name: Publish OCI Charts to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
          GH_REPO: ${{ github.repository }}
        run: |
          echo "$GH_TOKEN" | helm registry login ghcr.io -u "$GH_ACTOR" --password-stdin
          mkdir -p .oci-packages
          for chart in charts/*; do
            if [ -f "$chart/Chart.yaml" ]; then
              chart_name=$(basename "$chart")
              echo "Packaging $chart_name for OCI..."
              helm package "$chart" --destination .oci-packages
            fi
          done
          for pkg in .oci-packages/*.tgz; do
            if [ -f "$pkg" ]; then
              echo "Pushing $pkg to GHCR OCI..."
              helm push "$pkg" "oci://ghcr.io/$GH_REPO/charts" || true
            fi
          done

      - name: Create Macro Release Tag for Foundations
        if: hashFiles('VERSION') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(cat VERSION | tr -d '[:space:]')
          TAG="v${VERSION}"
          echo "Checking if release tag $TAG exists on remote..."
          if [ -n "$(git ls-remote --tags origin "refs/tags/$TAG")" ]; then
            echo "Tag $TAG already exists on remote. Skipping macro release creation."
          else
            echo "Creating macro release tag $TAG..."
            gh release create "$TAG" \
              --title "GDC IaC Foundations $TAG" \
              --notes "Automated release for GDC air-gapped foundations and blueprints ($TAG)."
          fi

